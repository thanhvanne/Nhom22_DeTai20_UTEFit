spring.application.name=utefit-isolated-tests
spring.datasource.url=jdbc:h2:mem:utefit_tests;MODE=MSSQLServer;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.sql.init.mode=never
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=70MB
spring.mail.host=localhost
spring.mail.port=2525
utefit.mail.from=qa@utefit.test
utefit.jwt.secret-base64=dGVzdC1vbmx5LWRvLW5vdC11c2UtaW4tcHJvZHVjdGlvbi1rZXk=
utefit.jwt.cookie-secure=false
cloudinary.cloud-name=isolated-test
cloudinary.api-key=isolated-test
cloudinary.api-secret=isolated-test
utefit.scheduling.enabled=false
utefit.vnpay.enabled=false
spring.main.banner-mode=off
