
<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments/layout :: head('Thống kê hệ thống')}"></head>
<body class="uf-theme uf-area-admin uf-page-admin-statistics-index uf-admin">
<div class="admin-shell">
    <aside th:replace="~{admin/fragments/layout :: sidebar}"></aside>
    <div class="admin-workspace">
        <nav th:replace="~{admin/fragments/layout :: topbar('Thống kê hệ thống')}"></nav>

        <main class="admin-main" id="utefit-content" tabindex="-1">
            <div class="admin-page-heading mb-4">
                <h2 class="fw-bold">Báo cáo & Thống kê</h2>
                <p class="mb-0 text-muted">
                    Phân tích hội viên, doanh thu và hoạt động phòng tập.
                </p>
            </div>

            <section class="admin-statistics-metrics" aria-label="Chỉ số hệ thống">
                <div><div class="text-secondary small">Tổng hội viên</div><div class="admin-stat-value" th:text="${totalMembers}">0</div></div>
                <div><div class="text-secondary small">Huấn luyện viên</div><div class="admin-stat-value" th:text="${totalTrainers}">0</div></div>
                <div><div class="text-secondary small">Chi nhánh</div><div class="admin-stat-value" th:text="${totalBranches}">0</div></div>
                <div><div class="text-secondary small">Lớp tập</div><div class="admin-stat-value" th:text="${totalClasses}">0</div></div>
                <div><div class="text-secondary small">Gói tập còn hiệu lực</div><div class="admin-stat-value" th:text="${activeMemberships}">0</div></div>
                <div><div class="text-secondary small">Vào tập tháng này</div><div class="admin-stat-value" th:text="${checkinsThisMonth}">0</div></div>
                <div><div class="text-secondary small">Hội viên mới tháng này</div><div class="admin-stat-value" th:text="${newMembersThisMonth}">0</div></div>
                <div><div class="text-secondary small">Tổng doanh thu đã thu</div><div class="admin-stat-value admin-stat-money" th:text="|${#numbers.formatDecimal(revenueTotal,1,0)} đ|" data-uf-money>0 đ</div></div>
            </section>

            <div class="surface-card p-4 mb-4">
                <h2 class="fw-bold mb-3">
                    Doanh thu theo tháng (6 tháng gần nhất)
                </h2>
                <div class="admin-statistics-chart">
                    <canvas id="revenueChart" role="img" aria-label="Doanh thu theo tháng, đơn vị đồng Việt Nam"></canvas>
                </div>
            </div>

            <div class="admin-ranking-charts">
                <div class="admin-ranking-panel">
                    <div class="surface-card admin-panel">
                        <h2 class="fw-bold">Top 5 gói tập</h2>
                        <div class="admin-statistics-chart">
                            <canvas id="planChart" role="img" aria-label="Doanh thu 5 gói tập cao nhất"></canvas>
                        </div>
                    </div>
                </div>
                <div class="admin-ranking-panel">
                    <div class="surface-card admin-panel">
                        <h2 class="fw-bold">Top 5 chi nhánh</h2>
                        <div class="admin-statistics-chart">
                            <canvas id="branchChart" role="img" aria-label="Doanh thu 5 chi nhánh cao nhất"></canvas>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>

<div th:replace="~{admin/fragments/layout :: scripts}"></div>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.8/dist/chart.umd.min.js"></script>

<script th:inline="javascript">
    const months = /*[[${monthlyLabels}]]*/ [];
    const revenue = /*[[${monthlyRevenue}]]*/ [];

    const planNames = /*[[${topPlanLabels}]]*/ [];
    const planRevenue = /*[[${topPlanValues}]]*/ [];

    const branchNames = /*[[${topBranchLabels}]]*/ [];
    const branchRevenue = /*[[${topBranchValues}]]*/ [];

    const formatMoney = value =>
        new Intl.NumberFormat('vi-VN', {
            style: 'currency',
            currency: 'VND',
            maximumFractionDigits: 0
        }).format(value);

    Chart.defaults.font.family = "'Be Vietnam Pro', sans-serif";
    Chart.defaults.color = '#616975';
    const chartFont = { family: "'Be Vietnam Pro', sans-serif", size: 11 };
    const compactMoney = value => new Intl.NumberFormat('vi-VN', { notation: 'compact', maximumFractionDigits: 1 }).format(value) + ' đ';
    const moneyOptions = {
        responsive: true,
        maintainAspectRatio: false,
        animation: false,
        plugins: {
            legend: { display: false },
            tooltip: {
                callbacks: {
                    label: context => formatMoney(context.parsed.y ?? 0)
                }
            }
        },
        scales: {
            x: { grid: { display: false }, border: { display: false }, ticks: { font: chartFont, maxTicksLimit: 6, maxRotation: 0 } },
            y: {
                beginAtZero: true,
                border: { display: false },
                grid: { color: '#eef0f3' },
                ticks: {
                    font: chartFont, maxTicksLimit: 4, callback: value => compactMoney(value)
                }
            }
        }
    };

    new Chart(document.getElementById('revenueChart'), {
        type: 'bar',
        data: {
            labels: months,
            datasets: [{
                label: 'Doanh thu VND',
                data: revenue,
                backgroundColor: '#d92332',
                borderRadius: 2
            }]
        },
        options: moneyOptions
    });

    function horizontalChart(elementId, labels, values, color) {
        new Chart(document.getElementById(elementId), {
            type: 'bar',
            data: {
                labels: labels,
                datasets: [{
                    label: 'Doanh thu VND',
                    data: values,
                    backgroundColor: color,
                    borderRadius: 2
                }]
            },
            options: {
                ...moneyOptions,
                indexAxis: 'y',
                scales: {
                    y: { grid: { display: false }, border: { display: false }, ticks: { font: chartFont, callback: function(value) { const name = this.getLabelForValue(value); return name.length > 24 ? name.match(/.{1,24}/g) : name; } } },
                    x: {
                        border: { display: false }, grid: { color: '#eef0f3' },
                        beginAtZero: true,
                        ticks: {
                            font: chartFont, maxTicksLimit: 4, callback: value => compactMoney(value)
                        }
                    }
                },
                plugins: {
                    legend: { display: false },
                    tooltip: {
                        callbacks: {
                            label: context =>
                                formatMoney(context.parsed.x ?? 0)
                        }
                    }
                }
            }
        });
    }

    horizontalChart(
        'planChart', planNames, planRevenue, '#d92332');

    horizontalChart(
        'branchChart', branchNames, branchRevenue, '#747d8b');
</script>
</body>
</html>
