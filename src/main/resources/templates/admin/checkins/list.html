
<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments/layout :: head('Check-in')}"></head>
<body>
<div class="d-flex">
    <aside th:replace="~{admin/fragments/layout :: sidebar}"></aside>
    <div class="flex-grow-1 min-vh-100" style="min-width:0">
        <nav th:replace="~{admin/fragments/layout :: topbar('Quản lý Check-in')}"></nav>

        <main class="container-fluid px-4 pb-5">
            <div class="admin-hero-banner mb-4">
                <h2 class="fw-bold">Quản lý Check-in / Checkout</h2>
                <p class="mb-0 text-white-50">
                    Xác nhận Member đến phòng tập, kiểm tra gói tập
                    và quản lý lịch sử ra vào.
                </p>
            </div>

            <div th:if="${success}" class="alert alert-success"
                 th:text="${success}"></div>
            <div th:if="${error}" class="alert alert-danger"
                 th:text="${error}"></div>

            <div class="surface-card p-4 mb-4">
                <h5 class="fw-bold mb-3">Quét QR Check-in</h5>
                <form th:action="@{/admin/checkins/qr}" method="post" id="qr-checkin-form" class="row g-3">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <div class="col-md-5">
                        <label class="form-label" for="qr-branch">Chi nhánh nhận check-in</label>
                        <select id="qr-branch" name="branchId" class="form-select" required>
                            <option value="">-- Chọn chi nhánh --</option>
                            <option th:each="branch : ${branches}" th:value="${branch.id}" th:text="${branch.name}"></option>
                        </select>
                    </div>
                    <div class="col-md-5">
                        <label class="form-label" for="qr-token">Mã QR đã quét / nhập tại quầy</label>
                        <input id="qr-token" name="qrToken" class="form-control" required maxlength="60" autocomplete="off">
                    </div>
                    <div class="col-md-2 d-flex align-items-end">
                        <button type="submit" class="btn btn-success w-100">Xác nhận QR</button>
                    </div>
                </form>
                <button type="button" id="qr-camera-start" class="btn btn-outline-primary mt-3">Mở camera quét QR</button>
                <button type="button" id="qr-camera-stop" class="btn btn-outline-secondary mt-3" hidden>Dừng camera</button>
                <p id="qr-camera-status" role="status" class="mt-2"></p>
                <video id="qr-camera" playsinline muted hidden class="w-100" style="max-width:480px"></video>
            </div>
            <script th:src="@{/js/qr-scanner.js}" defer></script>

            <div class="surface-card p-4 mb-4">
                <h5 class="fw-bold mb-3">Check-in Member</h5>
                <form th:action="@{/admin/checkins}" method="post"
                      class="row g-3">
                    <input type="hidden" th:name="${_csrf.parameterName}"
                           th:value="${_csrf.token}">
                    <div class="col-md-5">
                        <label class="form-label">Email Member</label>
                        <input type="email" name="email" required
                               class="form-control"
                               placeholder="member@gmail.com">
                    </div>
                    <div class="col-md-5">
                        <label class="form-label">Chi nhánh</label>
                        <select name="branchId" class="form-select" required>
                            <option value="">-- Chọn chi nhánh --</option>
                            <option th:each="b : ${branches}"
                                    th:value="${b.id}"
                                    th:text="${b.name}"></option>
                        </select>
                    </div>
                    <div class="col-md-2 d-flex align-items-end">
                        <button class="btn btn-success w-100" type="submit">
                            <i class="bi bi-check-circle"></i> Check-in
                        </button>
                    </div>
                </form>
            </div>

            <div class="surface-card p-4">
                <h5 class="fw-bold mb-3">Lịch sử Check-in</h5>

                <form method="get" th:action="@{/admin/checkins}"
                      class="row g-2 mb-4">
                    <div class="col-md-4">
                        <input name="email" class="form-control"
                               placeholder="Tìm email"
                               th:value="${email}">
                    </div>
                    <div class="col-md-3">
                        <select name="branchId" class="form-select">
                            <option value="">Tất cả chi nhánh</option>
                            <option th:each="b : ${branches}"
                                    th:value="${b.id}"
                                    th:text="${b.name}"
                                    th:selected="${branchId == b.id}"></option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <input type="date" name="date" class="form-control"
                               th:value="${date}">
                    </div>
                    <div class="col-md-2">
                        <select name="open" class="form-select">
                            <option value="">Tất cả</option>
                            <option value="true" th:selected="${open == true}">
                                Chưa checkout
                            </option>
                            <option value="false" th:selected="${open == false}">
                                Đã checkout
                            </option>
                        </select>
                    </div>
                    <div class="col-md-1">
                        <button class="btn btn-primary w-100">Lọc</button>
                    </div>
                </form>

                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead>
                        <tr>
                            <th>ID</th><th>Member</th><th>Chi nhánh</th>
                            <th>Check-in</th><th>Checkout</th><th>Thao tác</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="c : ${checkinPage.content}">
                            <td th:text="${c.id}"></td>
                            <td>
                                <strong th:text="${c.user.fullName}"></strong>
                                <div class="small text-muted"
                                     th:text="${c.user.email}"></div>
                            </td>
                            <td th:text="${c.branch.name}"></td>
                            <td th:text="${#temporals.format(c.checkInAt,
                                               'dd/MM/yyyy HH:mm')}"></td>
                            <td th:text="${c.checkOutAt == null ? 'Chưa checkout' :
                                     #temporals.format(c.checkOutAt,
                                               'dd/MM/yyyy HH:mm')}"></td>
                            <td>
                                <form th:if="${c.checkOutAt == null}"
                                      th:action="@{/admin/checkins/{id}/checkout(id=${c.id})}"
                                      method="post">
                                    <input type="hidden"
                                           th:name="${_csrf.parameterName}"
                                           th:value="${_csrf.token}">
                                    <button type="submit"
                                            class="btn btn-outline-danger btn-sm"
                                            onclick="return confirm('Xác nhận checkout?')">
                                        Checkout
                                    </button>
                                </form>
                                <span th:if="${c.checkOutAt != null}"
                                      class="badge text-bg-success">
                                    Đã hoàn tất
                                </span>
                            </td>
                        </tr>
                        <tr th:if="${checkinPage.empty}">
                            <td colspan="6" class="text-center text-muted py-4">
                                Chưa có dữ liệu check-in.
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>

                <div class="d-flex align-items-center justify-content-between">
                    <span class="small text-muted"
                          th:text="|Tổng ${checkinPage.totalElements} lượt|"></span>
                    <div class="d-flex gap-2">
                        <a class="btn btn-outline-secondary btn-sm"
                           th:if="${checkinPage.hasPrevious()}"
                           th:href="@{/admin/checkins(page=${checkinPage.number - 1},
                                   email=${email},branchId=${branchId},
                                   date=${date},open=${open})}">Trước</a>
                        <a class="btn btn-outline-secondary btn-sm"
                           th:if="${checkinPage.hasNext()}"
                           th:href="@{/admin/checkins(page=${checkinPage.number + 1},
                                   email=${email},branchId=${branchId},
                                   date=${date},open=${open})}">Sau</a>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>
<div th:replace="~{admin/fragments/layout :: scripts}"></div>
</body>
</html>
