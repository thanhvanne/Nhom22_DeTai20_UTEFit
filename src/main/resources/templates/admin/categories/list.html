<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments/layout :: head('Quản lý Loại lớp')}"></head>
<body class="uf-theme uf-area-admin uf-page-admin-categories-list uf-admin">
<div class="admin-shell">
    <div th:replace="~{admin/fragments/layout :: sidebar}"></div>

    <div class="admin-workspace">
        <div th:replace="~{admin/fragments/layout :: topbar('Loại lớp tập')}"></div>

        <main class="admin-main" id="utefit-content" tabindex="-1">
            <div class="admin-page-heading"><p>Danh mục bộ môn và quyền lợi gói tập dùng để đặt lớp.</p></div>
            <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show">
                <i class="bi bi-check-circle-fill me-2"></i> <span th:text="${successMessage}" data-uf-label></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Đóng thông báo"></button>
            </div>
            <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show">
                <i class="bi bi-exclamation-triangle-fill me-2"></i> <span th:text="${errorMessage}" data-uf-label></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Đóng thông báo"></button>
            </div>

            <!-- Thanh công cụ tìm kiếm & lọc -->
            <div class="surface-card admin-filter-panel">
                <form method="get" th:action="@{/admin/categories}" class="admin-query">
                    <div class="admin-query-field">
                        <label class="form-label small fw-bold text-secondary" for="admin-categories-list-html-active">Tìm kiếm loại lớp</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0"><i class="bi bi-search text-muted"></i></span>
                            <input type="text" name="keyword" class="form-control border-start-0"
                                   placeholder="Nhập tên loại lớp (Yoga, Boxing, Zumba...)" th:value="${keyword}" aria-label="Từ khóa tìm kiếm">
                        </div>
                    </div>
                    <div class="admin-query-field">
                        <label class="form-label small fw-bold text-secondary">Trạng thái</label>
                        <select name="active" class="form-select" id="admin-categories-list-html-active">
                            <option value="">-- Tất cả trạng thái --</option>
                            <option value="true" th:selected="${selectedActive != null and selectedActive}">Đang hoạt động</option>
                            <option value="false" th:selected="${selectedActive != null and !selectedActive}">Tạm ngưng</option>
                        </select>
                    </div>
                    <div class="admin-query-field">
                        <button type="submit" class="btn btn-outline-secondary w-100"><i class="bi bi-funnel-fill me-1"></i> Lọc</button>
                        <a th:href="@{/admin/categories}" class="btn btn-outline-secondary" title="Đặt lại" aria-label="Đặt lại bộ lọc"><i class="bi bi-arrow-counterclockwise"></i></a>
                    </div>
                    <div class="admin-query-field">
                        <a th:href="@{/admin/categories/create}" class="btn btn-primary w-100 fw-semibold">
                            <i class="bi bi-plus-lg me-1"></i> Thêm loại lớp
                        </a>
                    </div>
                </form>
            </div>

            <!-- Bảng dữ liệu Loại lớp -->
            <div class="surface-card admin-table-panel">
                <div class="admin-table-heading"><h2>Danh sách loại lớp tập</h2><p class="admin-scroll-hint">Cuộn ngang để xem đầy đủ trên máy tính bảng.</p></div>
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0 admin-data-table">
                        <thead>
                        <tr>
                            <th class="ps-4" style="width: 70px;">ID</th>
                            <th>Tên loại lớp (Category)</th>
                            <th>Mô tả bộ môn</th>
                            <th>Ngày tạo</th>
                            <th>Trạng thái</th>
                            <th class="pe-4">Thao tác</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:if="${categoryPage.empty}">
                            <td colspan="6" class="text-center py-5 text-muted admin-empty">
                                <i class="bi bi-tags fs-1 d-block mb-2 text-secondary opacity-50"></i>
                                Chưa có danh mục loại lớp nào.
                            </td>
                        </tr>
                        <tr th:each="c : ${categoryPage.content}">
                            <td class="ps-4 fw-bold text-secondary" th:text="'#' + ${c.id}" data-label="ID">#1</td>
                            <td data-label="Tên loại lớp (Category)" class="admin-record-primary">
                                <span class="fw-bold text-dark fs-6">
                                    <i class="bi bi-bookmark-star-fill text-success me-1"></i>
                                    <span th:text="${c.name}">Yoga</span>
                                </span>
                            </td>
                            <td class="text-secondary small" style="max-width: 420px;"
                                th:text="${c.description != null and !#strings.isEmpty(c.description) ? c.description : '—'}" data-label="Mô tả bộ môn"></td>
                            <td class="text-secondary small"
                                th:text="${c.createdAt != null ? #temporals.format(c.createdAt, 'dd/MM/yyyy HH:mm') : '—'}" data-label="Ngày tạo"></td>
                            <td data-label="Trạng thái">
                                <span th:if="${c.active}" class="status-pill bg-success bg-opacity-10 text-success">
                                    <span class="dot bg-success"></span> Hoạt động
                                </span>
                                <span th:unless="${c.active}" class="status-pill bg-secondary bg-opacity-10 text-secondary">
                                    <span class="dot bg-secondary"></span> Tạm ngưng
                                </span>
                            </td>
                            <td class="pe-4 admin-record-actions" data-label="Thao tác">
                                <a th:href="@{/admin/categories/{id}/edit(id=${c.id})}" class="btn btn-sm btn-outline-dark px-3 me-1">
                                    <i class="bi bi-pencil-square me-1"></i> Sửa
                                </a>
                                <form th:action="@{/admin/categories/{id}/toggle-active(id=${c.id})}" method="post" class="d-inline">
                                    <button type="submit" class="btn btn-sm px-3"
                                            th:classappend="${c.active ? 'btn-outline-warning' : 'btn-outline-success'}">
                                        <span th:text="${c.active ? 'Tắt' : 'Bật'}"></span>
                                    </button>
                                </form>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>

                <div class="admin-pagination" th:if="${categoryPage.totalPages > 1}">
                    <span class="small text-muted">Trang <b th:text="${categoryPage.number + 1}"></b> / <b th:text="${categoryPage.totalPages}"></b></span>
                    <ul class="pagination pagination-sm mb-0">
                        <li class="page-item" th:classappend="${categoryPage.first} ? 'disabled'">
                            <a class="page-link" th:href="@{/admin/categories(page=${categoryPage.number - 1}, keyword=${keyword}, active=${selectedActive})}">Trước</a>
                        </li>
                        <li class="page-item" th:each="i : ${#numbers.sequence(0, categoryPage.totalPages - 1)}"
                            th:classappend="${i == categoryPage.number} ? 'active'">
                            <a class="page-link" th:href="@{/admin/categories(page=${i}, keyword=${keyword}, active=${selectedActive})}" th:text="${i + 1}"></a>
                        </li>
                        <li class="page-item" th:classappend="${categoryPage.last} ? 'disabled'">
                            <a class="page-link" th:href="@{/admin/categories(page=${categoryPage.number + 1}, keyword=${keyword}, active=${selectedActive})}">Sau</a>
                        </li>
                    </ul>
                </div>
            </div>
        </main>
    </div>
</div>
<div th:replace="~{admin/fragments/layout :: scripts}"></div>
</body>
</html>
