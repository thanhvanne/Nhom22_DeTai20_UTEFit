<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments/layout :: head('Quản lý Loại lớp')}"></head>
<body>
<div class="d-flex">
    <div th:replace="~{admin/fragments/layout :: sidebar}"></div>

    <div class="flex-grow-1">
        <div th:replace="~{admin/fragments/layout :: topbar('Quản lý Loại lớp tập (Class Categories)')}"></div>

        <main class="container-fluid px-4 pb-5">
            <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show shadow-sm rounded-4 border-0">
                <i class="bi bi-check-circle-fill me-2"></i> <span th:text="${successMessage}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
            <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show shadow-sm rounded-4 border-0">
                <i class="bi bi-exclamation-triangle-fill me-2"></i> <span th:text="${errorMessage}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <!-- Thanh công cụ tìm kiếm & lọc -->
            <div class="surface-card p-4 mb-4">
                <form method="get" th:action="@{/admin/categories}" class="row g-3 align-items-end">
                    <div class="col-md-5">
                        <label class="form-label small fw-bold text-secondary text-uppercase">Tìm kiếm loại lớp</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0"><i class="bi bi-search text-muted"></i></span>
                            <input type="text" name="keyword" class="form-control border-start-0"
                                   placeholder="Nhập tên loại lớp (Yoga, Boxing, Zumba...)" th:value="${keyword}">
                        </div>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label small fw-bold text-secondary text-uppercase">Trạng thái</label>
                        <select name="active" class="form-select">
                            <option value="">-- Tất cả trạng thái --</option>
                            <option value="true" th:selected="${selectedActive != null and selectedActive}">Đang hoạt động</option>
                            <option value="false" th:selected="${selectedActive != null and !selectedActive}">Tạm ngưng</option>
                        </select>
                    </div>
                    <div class="col-md-2 d-flex gap-2">
                        <button type="submit" class="btn btn-utefit w-100"><i class="bi bi-funnel-fill me-1"></i> Lọc</button>
                        <a th:href="@{/admin/categories}" class="btn btn-outline-secondary" title="Đặt lại"><i class="bi bi-arrow-counterclockwise"></i></a>
                    </div>
                    <div class="col-md-2 text-end">
                        <a th:href="@{/admin/categories/create}" class="btn btn-dark w-100 fw-semibold">
                            <i class="bi bi-plus-lg text-success me-1"></i> Thêm loại lớp
                        </a>
                    </div>
                </form>
            </div>

            <!-- Bảng dữ liệu Loại lớp -->
            <div class="surface-card overflow-hidden">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead>
                        <tr>
                            <th class="ps-4" style="width: 70px;">ID</th>
                            <th>Tên loại lớp (Category)</th>
                            <th>Mô tả bộ môn</th>
                            <th>Ngày tạo</th>
                            <th>Trạng thái</th>
                            <th class="text-end pe-4">Thao tác</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:if="${categoryPage.empty}">
                            <td colspan="6" class="text-center py-5 text-muted">
                                <i class="bi bi-tags fs-1 d-block mb-2 text-secondary opacity-50"></i>
                                Chưa có danh mục loại lớp nào.
                            </td>
                        </tr>
                        <tr th:each="c : ${categoryPage.content}">
                            <td class="ps-4 fw-bold text-secondary" th:text="'#' + ${c.id}">#1</td>
                            <td>
                                <span class="fw-bold text-dark fs-6">
                                    <i class="bi bi-bookmark-star-fill text-success me-1"></i>
                                    <span th:text="${c.name}">Yoga</span>
                                </span>
                            </td>
                            <td class="text-secondary small" style="max-width: 420px;"
                                th:text="${c.description != null and !#strings.isEmpty(c.description) ? c.description : '—'}"></td>
                            <td class="text-secondary small"
                                th:text="${c.createdAt != null ? #temporals.format(c.createdAt, 'dd/MM/yyyy HH:mm') : '—'}"></td>
                            <td>
                                <span th:if="${c.active}" class="status-pill bg-success bg-opacity-10 text-success">
                                    <span class="dot bg-success"></span> Hoạt động
                                </span>
                                <span th:unless="${c.active}" class="status-pill bg-secondary bg-opacity-10 text-secondary">
                                    <span class="dot bg-secondary"></span> Tạm ngưng
                                </span>
                            </td>
                            <td class="text-end pe-4">
                                <a th:href="@{/admin/categories/{id}/edit(id=${c.id})}" class="btn btn-sm btn-outline-dark rounded-pill px-3 me-1">
                                    <i class="bi bi-pencil-square me-1"></i> Sửa
                                </a>
                                <form th:action="@{/admin/categories/{id}/toggle-active(id=${c.id})}" method="post" class="d-inline">
                                    <button type="submit" class="btn btn-sm rounded-pill px-3"
                                            th:classappend="${c.active ? 'btn-outline-warning' : 'btn-outline-success'}">
                                        <span th:text="${c.active ? 'Tắt' : 'Bật'}"></span>
                                    </button>
                                </form>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>

                <div class="card-footer bg-white d-flex justify-content-between align-items-center px-4 py-3" th:if="${categoryPage.totalPages > 1}">
                    <span class="small text-muted">Trang <b th:text="${categoryPage.number + 1}"></b> / <b th:text="${categoryPage.totalPages}"></b></span>
                    <ul class="pagination pagination-sm mb-0">
                        <li class="page-item" th:classappend="${categoryPage.first} ? 'disabled'">
                            <a class="page-link" th:href="@{/admin/categories(page=${categoryPage.number - 1}, keyword=${keyword}, active=${selectedActive})}">Trước</a>
                        </li>
                        <li class="page-item" th:each="i : ${#numbers.sequence(0, categoryPage.totalPages - 1)}"
                            th:classappend="${i == categoryPage.number} ? 'active'">
                            <a class="page-link" th:href="@{/admin/categories(page=${i}, keyword=${keyword}, active=${selectedActive})}" th:text="${i + 1}"></a>
                        </li>
                        <li class="page-item" th:classappend="${categoryPage.last} ? 'disabled'">
                            <a class="page-link" th:href="@{/admin/categories(page=${categoryPage.number + 1}, keyword=${keyword}, active=${selectedActive})}">Sau</a>
                        </li>
                    </ul>
                </div>
            </div>
        </main>
    </div>
</div>
<div th:replace="~{admin/fragments/layout :: scripts}"></div>
</body>
</html>
