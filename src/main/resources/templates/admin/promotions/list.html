
<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments/layout :: head('Khuyến mãi')}"></head>
<body class="uf-theme uf-area-admin uf-page-admin-promotions-list">
<div class="d-flex">
    <aside th:replace="~{admin/fragments/layout :: sidebar}"></aside>
    <div class="flex-grow-1 min-vh-100" style="min-width:0">
        <nav th:replace="~{admin/fragments/layout :: topbar('Quản lý khuyến mãi')}"></nav>
        <main class="container-fluid px-4 pb-5">

            <div class="admin-hero-banner mb-4">
                <h2 class="fw-bold">Mã khuyến mãi</h2>
                <p class="text-white-50 mb-0">
                    Tạo và quản lý mã giảm giá cho hệ thống UTEFit.
                </p>
            </div>

            <div th:if="${success}" class="alert alert-success"
                 th:text="${success}" data-uf-label></div>
            <div th:if="${error}" class="alert alert-danger"
                 th:text="${error}" data-uf-label></div>

            <div class="surface-card p-4 mb-4">
                <h5 class="fw-bold mb-3"
                    th:text="${editId == null ? 'Tạo khuyến mãi mới' :
                                            'Chỉnh sửa khuyến mãi'}" data-uf-label></h5>

                <form th:action="@{/admin/promotions/save}"
                      th:object="${form}" method="post"
                      class="row g-3">
                    <input type="hidden" th:name="${_csrf.parameterName}"
                           th:value="${_csrf.token}">
                    <input type="hidden" name="id" th:if="${editId != null}"
                           th:value="${editId}">

                    <div class="col-md-3">
                        <label class="form-label">Mã khuyến mãi</label>
                        <input th:field="*{code}" class="form-control"
                               maxlength="50" required
                               placeholder="UTEFIT20">
                    </div>

                    <div class="col-md-2">
                        <label class="form-label">Giảm (%)</label>
                        <input type="number" th:field="*{discountPercent}"
                               class="form-control" min="0.01"
                               max="100" step="0.01" required>
                    </div>

                    <div class="col-md-2">
                        <label class="form-label">Bắt đầu</label>
                        <input type="date" th:field="*{startDate}"
                               class="form-control" required>
                    </div>

                    <div class="col-md-2">
                        <label class="form-label">Kết thúc</label>
                        <input type="date" th:field="*{endDate}"
                               class="form-control" required>
                    </div>

                    <div class="col-md-2">
                        <label class="form-label">Số lượng</label>
                        <input type="number" th:field="*{quantity}"
                               class="form-control" min="0" required>
                    </div>

                    <div class="col-md-1">
                        <label class="form-label">Hoạt động</label>
                        <select th:field="*{active}" class="form-select">
                            <option value="true">Có</option>
                            <option value="false">Không</option>
                        </select>
                    </div>

                    <div class="col-12 d-flex gap-2">
                        <button class="btn btn-success" type="submit">
                            Lưu khuyến mãi
                        </button>
                        <a th:if="${editId != null}" class="btn btn-secondary"
                           th:href="@{/admin/promotions}">Hủy sửa</a>
                    </div>
                </form>
            </div>

            <div class="surface-card p-4">
                <h5 class="fw-bold mb-3">Danh sách khuyến mãi</h5>
                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead>
                        <tr>
                            <th>ID</th><th>Mã</th><th>Giảm</th>
                            <th>Thời gian</th><th>Số lượng</th>
                            <th>Trạng thái</th><th>Thao tác</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="p : ${promotions}">
                            <td th:text="${p.id}"></td>
                            <td class="fw-bold" th:text="${p.code}"></td>
                            <td th:text="|${p.discountPercent}%|"></td>
                            <td>
                                <span th:text="${p.startDate}" data-uf-date></span>
                                đến <span th:text="${p.endDate}" data-uf-date></span>
                            </td>
                            <td th:text="${p.quantity}"></td>
                            <td>
                                <span class="badge"
                                      th:classappend="${p.active ?
                                          'text-bg-success' : 'text-bg-secondary'}"
                                      th:text="${p.active ? 'ACTIVE' : 'INACTIVE'}">
                                </span>
                            </td>
                            <td>
                                <div class="d-flex gap-2">
                                    <a class="btn btn-primary btn-sm"
                                       th:href="@{/admin/promotions(editId=${p.id})}">
                                        Sửa
                                    </a>
                                    <form th:action="@{/admin/promotions/{id}/toggle(id=${p.id})}"
                                          method="post">
                                        <input type="hidden"
                                               th:name="${_csrf.parameterName}"
                                               th:value="${_csrf.token}">
                                        <button type="submit"
                                                class="btn btn-outline-warning btn-sm">
                                            Bật/Tắt
                                        </button>
                                    </form>
                                </div>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(promotions)}">
                            <td colspan="7" class="text-center text-muted">
                                Chưa có khuyến mãi nào.
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </main>
    </div>
</div>
<div th:replace="~{admin/fragments/layout :: scripts}"></div>
</body>
</html>
