
<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{admin/fragments/layout :: head('Duyệt thanh toán CASH')}">
</head>

<body class="uf-theme uf-area-admin uf-page-admin-payments-cash-pending uf-admin">

<div class="admin-shell">

    <aside th:replace="~{admin/fragments/layout :: sidebar}">
    </aside>

    <div class="admin-workspace">

        <nav th:replace="~{admin/fragments/layout :: topbar('Thanh toán tiền mặt')}">
        </nav>

        <main class="admin-main" id="utefit-content" tabindex="-1">

            <div class="admin-page-heading mb-4">

                <h2 class="fw-bold mb-2">
                    Xác nhận thanh toán tiền mặt
                </h2>

                <p class="mb-0 text-muted">
                    Chỉ nhấn xác nhận khi nhân viên
                    đã thực sự nhận đủ tiền tại quầy.
                </p>

            </div>

            <div th:if="${success}"
                 class="alert alert-success"
                 th:text="${success}" data-uf-label>
            </div>

            <div th:if="${error}"
                 class="alert alert-danger"
                 th:text="${error}" data-uf-label>
            </div>

            <div class="surface-card p-4">

                <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">

                    <h2 class="fw-bold mb-0">
                        Giao dịch đang chờ
                    </h2>

                    <a class="btn btn-outline-secondary btn-sm"
                       th:href="@{/admin/payments/cash-pending}">
                        Làm mới
                    </a>

                </div>

                <div class="table-responsive">

                    <table class="table align-middle admin-data-table">

                        <thead>
                        <tr>
                            <th>Mã GD</th>
                            <th>Email Hội viên</th>
                            <th>Gói tập</th>
                            <th>Chi nhánh</th>
                            <th>Số tiền</th>
                            <th>Ngày tạo</th>
                            <th>Xác nhận</th>
                        </tr>
                        </thead>

                        <tbody>

                        <tr th:each="p : ${payments}">

                            <td th:text="${p.id}" data-label="Mã GD">
                                1
                            </td>

                            <td th:text="${p.memberEmail}" data-label="Email Hội viên" class="admin-record-primary">
                                Email hội viên
                            </td>

                            <td th:text="${@membershipDisplay.name(p.planName)}" data-label="Gói tập">
                                Gói tập
                            </td>

                            <td th:text="${@membershipDisplay.name(p.branchName)}" data-label="Chi nhánh">
                                Chi nhánh
                            </td>

                            <td class="fw-bold admin-number"
                                th:text="${@membershipDisplay.money(p.amount)}" data-label="Số tiền">
                                0 VND
                            </td>

                            <td th:text="${#temporals.format(p.createdAt, 'dd/MM/yyyy HH:mm')}" data-label="Ngày tạo">
                                01/01/2026
                            </td>

                            <td data-label="Xác nhận" class="admin-record-actions">

                                <form th:action="@{/admin/payments/{id}/confirm-cash(id=${p.id})}"
                                      method="post">

                                    <input type="hidden"
                                           th:name="${_csrf.parameterName}"
                                           th:value="${_csrf.token}">

                                    <button class="btn btn-success btn-sm"
                                            type="submit"
                                            onclick="return confirm('Đã thu đủ tiền từ hội viên và muốn kích hoạt gói tập?')">
                                        Xác nhận đã thu
                                    </button>

                                </form>

                            </td>

                        </tr>

                        </tbody>
                    </table>

                </div>

                <div th:if="${#lists.isEmpty(payments)}"
                     class="text-center text-secondary py-5">

                    Hiện không có giao dịch tiền mặt
                    đang chờ xác nhận.

                </div>

            </div>

        </main>
    </div>
</div>

<div th:replace="~{admin/fragments/layout :: scripts}">
</div>

</body>
</html>
