
<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments/layout :: head('Chi tiết thanh toán')}"></head>
<body>
<div class="d-flex">
    <aside th:replace="~{admin/fragments/layout :: sidebar}"></aside>
    <div class="flex-grow-1 min-vh-100" style="min-width:0">
        <nav th:replace="~{admin/fragments/layout :: topbar('Chi tiết giao dịch')}"></nav>
        <main class="container-fluid px-4 pb-5">

            <div class="admin-hero-banner mb-4">
                <h2 class="fw-bold"
                    th:text="|Giao dịch #${payment.id}|"></h2>
                <p class="text-white-50 mb-0">
                    Thông tin thanh toán được lấy từ Database.
                </p>
            </div>

            <div class="surface-card p-4">
                <div class="row g-4">
                    <div class="col-md-6">
                        <div class="text-muted small">Member</div>
                        <div class="fw-semibold"
                             th:text="${payment.memberEmail}"></div>
                    </div>
                    <div class="col-md-6">
                        <div class="text-muted small">Gói tập</div>
                        <div class="fw-semibold"
                             th:text="${payment.planName}"></div>
                    </div>
                    <div class="col-md-6">
                        <div class="text-muted small">Chi nhánh</div>
                        <div th:text="${payment.branchName}"></div>
                    </div>
                    <div class="col-md-6">
                        <div class="text-muted small">Số tiền</div>
                        <div class="fs-4 fw-bold text-success"
                             th:text="|${#numbers.formatDecimal(payment.amount,1,0)} đ|"></div>
                    </div>
                    <div class="col-md-6">
                        <div class="text-muted small">Phương thức</div>
                        <div th:text="${payment.method}"></div>
                    </div>
                    <div class="col-md-6">
                        <div class="text-muted small">Trạng thái</div>
                        <div class="fw-bold" th:text="${payment.status}"></div>
                    </div>
                    <div class="col-md-6">
                        <div class="text-muted small">Mã giao dịch</div>
                        <div th:text="${payment.transactionCode ?: '-'}"></div>
                    </div>
                    <div class="col-md-6">
                        <div class="text-muted small">Ngày tạo</div>
                        <div th:text="${#temporals.format(payment.createdAt,
                                                     'dd/MM/yyyy HH:mm')}"></div>
                    </div>
                    <div class="col-md-6">
                        <div class="text-muted small">Ngày thanh toán</div>
                        <div th:text="${payment.paidAt == null ? '-' :
                           #temporals.format(payment.paidAt,
                                             'dd/MM/yyyy HH:mm')}"></div>
                    </div>
                </div>

                <a th:href="@{/admin/payments}"
                   class="btn btn-outline-secondary mt-4">
                    Quay lại danh sách
                </a>
            </div>
        </main>
    </div>
</div>
<div th:replace="~{admin/fragments/layout :: scripts}"></div>
</body>
</html>
