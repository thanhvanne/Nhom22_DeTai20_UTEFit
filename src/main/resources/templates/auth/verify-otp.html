<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head('Xác thực OTP')}">
</head>

<body class="uf-theme uf-area-auth uf-page-auth-verify-otp">

<header th:replace="~{fragments/header :: header}">
</header>

<main class="container py-5 uf-auth-shell" style="max-width: 600px;">
    <aside class="uf-auth-story" aria-label="Chào mừng đến UTEFit">
        <div class="uf-auth-brand" aria-hidden="true">UTE<span>FIT</span></div>
        <div><p class="uf-auth-statement">Mạnh mẽ hơn mỗi ngày.</p><p>Gói tập, lịch luyện tập và huấn luyện viên của bạn, trong một không gian.</p></div>
        <div class="uf-auth-story-foot">Đồng hành cùng mỗi buổi tập của bạn</div>
    </aside>
    <section class="uf-auth-form">

    <h1>Xác thực email</h1>

    <p>Nhập mã OTP đã gửi tới email của bạn.</p>

    <div class="alert alert-success"
         th:if="${success}"
         th:text="${success}" data-uf-label>
    </div>

    <div class="alert alert-danger"
         th:if="${error}"
         th:text="${error}" data-uf-label>
    </div>

    <form th:action="@{/verify-otp}"
          th:object="${form}"
          method="post">

        <div class="alert alert-danger"
             th:if="${#fields.hasGlobalErrors()}">

            <div th:each="err : ${#fields.globalErrors()}"
                 th:text="${err}">
            </div>

        </div>

        <div class="mb-3 ux u025-f is-up">
            <div class="u025-box">
            <input type="email"
                   class="form-control u025-in"
                   th:field="*{email}"
                   autocomplete="email"
                   required>
            <span class="u025-line" aria-hidden="true"><i class="l"></i><i class="g"></i><i class="r"></i></span>
            <label class="u025-lab" for="email">Email</label>
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label">
                OTP gồm 6 chữ số
            </label>

            <input type="text"
                   class="form-control"
                   th:field="*{code}"
                   autocomplete="one-time-code"
                   maxlength="6"
                   inputmode="numeric"
                   required>

            <div class="text-danger"
                 th:if="${#fields.hasErrors('code')}"
                 th:errors="*{code}">
            </div>
        </div>

        <button type="submit"
                class="btn btn-success w-100">

            Xác thực tài khoản

        </button>

    </form>

    <form th:action="@{/resend-otp}"
          method="post"
          class="mt-3">

        <input type="hidden"
               name="email"
               th:value="${form.email}">

        <button type="submit"
                class="btn btn-outline-secondary w-100">

            Gửi lại OTP

        </button>

    </form>

    </section>
</main>

<footer th:replace="~{fragments/footer :: footer}">
</footer>

<div th:replace="~{fragments/scripts :: scripts}">
</div>

</body>
</html>
