<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head('Xác thực OTP')}">
</head>

<body>

<header th:replace="~{fragments/header :: header}">
</header>

<main class="container py-5" style="max-width: 600px;">

    <h2>Xác thực email</h2>

    <p>Nhập mã OTP đã gửi tới email của bạn.</p>

    <div class="alert alert-success"
         th:if="${success}"
         th:text="${success}">
    </div>

    <div class="alert alert-danger"
         th:if="${error}"
         th:text="${error}">
    </div>

    <form th:action="@{/verify-otp}"
          th:object="${form}"
          method="post">

        <div class="alert alert-danger"
             th:if="${#fields.hasGlobalErrors()}">

            <div th:each="err : ${#fields.globalErrors()}"
                 th:text="${err}">
            </div>

        </div>

        <div class="mb-3">
            <label class="form-label">Email</label>

            <input type="email"
                   class="form-control"
                   th:field="*{email}"
                   required>
        </div>

        <div class="mb-3">
            <label class="form-label">
                OTP gồm 6 chữ số
            </label>

            <input type="text"
                   class="form-control"
                   th:field="*{code}"
                   maxlength="6"
                   inputmode="numeric"
                   required>

            <div class="text-danger"
                 th:if="${#fields.hasErrors('code')}"
                 th:errors="*{code}">
            </div>
        </div>

        <button type="submit"
                class="btn btn-success w-100">

            Xác thực tài khoản

        </button>

    </form>

    <form th:action="@{/resend-otp}"
          method="post"
          class="mt-3">

        <input type="hidden"
               name="email"
               th:value="${form.email}">

        <button type="submit"
                class="btn btn-outline-secondary w-100">

            Gửi lại OTP

        </button>

    </form>

</main>

<footer th:replace="~{fragments/footer :: footer}">
</footer>

<div th:replace="~{fragments/scripts :: scripts}">
</div>

</body>
</html>
