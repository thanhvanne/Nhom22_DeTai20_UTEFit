<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head('Đăng nhập UTEFit')}">
</head>

<body class="uf-theme uf-area-auth uf-page-auth-login">

<header th:replace="~{fragments/header :: header}">
</header>

<main class="container py-5 uf-auth-shell" style="max-width: 600px;">
    <aside class="uf-auth-story" aria-label="Chào mừng đến UTEFit">
        <div class="uf-auth-brand" aria-hidden="true">UTE<span>FIT</span></div>
        <div><p class="uf-auth-statement">Mạnh mẽ hơn mỗi ngày.</p><p>Gói tập, lịch luyện tập và huấn luyện viên của bạn, trong một không gian.</p></div>
        <div class="uf-auth-story-foot">Đồng hành cùng mỗi buổi tập của bạn</div>
    </aside>
    <section class="uf-auth-form">

    <h1 class="mb-4">Đăng nhập</h1>

    <div class="alert alert-success"
         th:if="${success}"
         th:text="${success}" data-uf-label>
    </div>

    <form th:action="@{/login}"
          th:object="${form}"
          method="post">

        <div class="alert alert-danger"
             th:if="${#fields.hasGlobalErrors()}">

            <div th:each="err : ${#fields.globalErrors()}"
                 th:text="${err}">
            </div>

        </div>

        <div class="mb-3 ux u025-f is-up">
            <div class="u025-box">
            <input type="email"
                   class="form-control u025-in"
                   th:field="*{email}"
                   autocomplete="username"
                   required>
            <span class="u025-line" aria-hidden="true"><i class="l"></i><i class="g"></i><i class="r"></i></span>
            <label class="u025-lab" for="email">Email</label>
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label" for="password">
                Mật khẩu
            </label>

            <div class="ux u036">
            <input type="password"
                   class="form-control"
                   th:field="*{password}"
                   autocomplete="current-password"
                   required>
            <th:block th:replace="~{fragments/field-tools :: passwordEye}"></th:block>
            </div>
        </div>

        <button type="submit"
                class="btn btn-primary w-100">

            Đăng nhập

        </button>

    </form>

    <div class="mt-3 text-center">

        <a th:href="@{/forgot-password}">
            Quên mật khẩu?
        </a>

        <span class="mx-2">|</span>

        <a th:href="@{/register}">
            Đăng ký
        </a>

    </div>

    </section>
</main>

<footer th:replace="~{fragments/footer :: footer}">
</footer>

<div th:replace="~{fragments/scripts :: scripts}">
</div>

</body>
</html>
