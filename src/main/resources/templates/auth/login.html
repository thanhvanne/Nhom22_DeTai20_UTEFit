<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head('Đăng nhập UTEFit')}">
</head>

<body>

<header th:replace="~{fragments/header :: header}">
</header>

<main class="container py-5" style="max-width: 600px;">

    <h2 class="mb-4">Đăng nhập</h2>

    <div class="alert alert-success"
         th:if="${success}"
         th:text="${success}">
    </div>

    <form th:action="@{/login}"
          th:object="${form}"
          method="post">

        <div class="alert alert-danger"
             th:if="${#fields.hasGlobalErrors()}">

            <div th:each="err : ${#fields.globalErrors()}"
                 th:text="${err}">
            </div>

        </div>

        <div class="mb-3">
            <label class="form-label">Email</label>

            <input type="email"
                   class="form-control"
                   th:field="*{email}"
                   required>
        </div>

        <div class="mb-3">
            <label class="form-label">
                Mật khẩu
            </label>

            <input type="password"
                   class="form-control"
                   th:field="*{password}"
                   required>
        </div>

        <button type="submit"
                class="btn btn-primary w-100">

            Đăng nhập

        </button>

    </form>

    <div class="mt-3 text-center">

        <a th:href="@{/forgot-password}">
            Quên mật khẩu?
        </a>

        <span class="mx-2">|</span>

        <a th:href="@{/register}">
            Đăng ký
        </a>

    </div>

</main>

<footer th:replace="~{fragments/footer :: footer}">
</footer>

<div th:replace="~{fragments/scripts :: scripts}">
</div>

</body>
</html>
