<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head('Quên mật khẩu')}">
</head>

<body>

<header th:replace="~{fragments/header :: header}">
</header>

<main class="container py-5" style="max-width: 600px;">

    <h2 class="mb-4">Quên mật khẩu</h2>

    <p>
        Nhập email đã đăng ký để nhận mã OTP
        đặt lại mật khẩu.
    </p>

    <form th:action="@{/forgot-password}"
          th:object="${form}"
          method="post">

        <div class="alert alert-danger"
             th:if="${#fields.hasGlobalErrors()}">

            <div th:each="err : ${#fields.globalErrors()}"
                 th:text="${err}">
            </div>

        </div>

        <div class="mb-3">
            <label class="form-label">
                Email tài khoản
            </label>

            <input type="email"
                   class="form-control"
                   th:field="*{email}"
                   required>

            <div class="text-danger"
                 th:if="${#fields.hasErrors('email')}"
                 th:errors="*{email}">
            </div>
        </div>

        <button type="submit"
                class="btn btn-primary w-100">

            Gửi OTP đặt lại mật khẩu

        </button>

    </form>

    <p class="mt-3 text-center">

        <a th:href="@{/login}">
            Quay lại đăng nhập
        </a>

    </p>

</main>

<footer th:replace="~{fragments/footer :: footer}">
</footer>

<div th:replace="~{fragments/scripts :: scripts}">
</div>

</body>
</html>
