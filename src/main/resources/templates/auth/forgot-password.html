<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head('Quên mật khẩu')}">
</head>

<body class="uf-theme uf-area-auth uf-page-auth-forgot-password">

<header th:replace="~{fragments/header :: header}">
</header>

<main class="container py-5 uf-auth-shell" style="max-width: 600px;">
    <aside class="uf-auth-story" aria-label="Chào mừng đến UTEFit">
        <div class="uf-auth-brand" aria-hidden="true">UTE<span>FIT</span></div>
        <div><p class="uf-auth-statement">Mạnh mẽ hơn mỗi ngày.</p><p>Gói tập, lịch luyện tập và huấn luyện viên của bạn, trong một không gian.</p></div>
        <div class="uf-auth-story-foot">Đồng hành cùng mỗi buổi tập của bạn</div>
    </aside>
    <section class="uf-auth-form">

    <h2 class="mb-4">Quên mật khẩu</h2>

    <p>
        Nhập email đã đăng ký để nhận mã OTP
        đặt lại mật khẩu.
    </p>

    <form th:action="@{/forgot-password}"
          th:object="${form}"
          method="post">

        <div class="alert alert-danger"
             th:if="${#fields.hasGlobalErrors()}">

            <div th:each="err : ${#fields.globalErrors()}"
                 th:text="${err}">
            </div>

        </div>

        <div class="mb-3">
            <label class="form-label">
                Email tài khoản
            </label>

            <input type="email"
                   class="form-control"
                   th:field="*{email}"
                   required>

            <div class="text-danger"
                 th:if="${#fields.hasErrors('email')}"
                 th:errors="*{email}">
            </div>
        </div>

        <button type="submit"
                class="btn btn-primary w-100">

            Gửi OTP đặt lại mật khẩu

        </button>

    </form>

    <p class="mt-3 text-center">

        <a th:href="@{/login}">
            Quay lại đăng nhập
        </a>

    </p>

    </section>
</main>

<footer th:replace="~{fragments/footer :: footer}">
</footer>

<div th:replace="~{fragments/scripts :: scripts}">
</div>

</body>
</html>
