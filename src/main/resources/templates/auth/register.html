<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head('Đăng ký UTEFit')}">
</head>

<body class="uf-theme uf-area-auth uf-page-auth-register">

<header th:replace="~{fragments/header :: header}">
</header>

<main class="container py-5 uf-auth-shell" style="max-width: 650px;">
    <aside class="uf-auth-story" aria-label="Chào mừng đến UTEFit">
        <div class="uf-auth-brand" aria-hidden="true">UTE<span>FIT</span></div>
        <div><p class="uf-auth-statement">Mạnh mẽ hơn mỗi ngày.</p><p>Gói tập, lịch luyện tập và huấn luyện viên của bạn, trong một không gian.</p></div>
        <div class="uf-auth-story-foot">Đồng hành cùng mỗi buổi tập của bạn</div>
    </aside>
    <section class="uf-auth-form">

    <h2 class="mb-4">Đăng ký tài khoản</h2>

    <form th:action="@{/register}"
          th:object="${form}"
          method="post">

        <div class="alert alert-danger"
             th:if="${#fields.hasGlobalErrors()}">

            <div th:each="err : ${#fields.globalErrors()}"
                 th:text="${err}">
            </div>

        </div>

        <div class="mb-3">
            <label class="form-label">Họ</label>

            <input type="text"
                   class="form-control"
                   th:field="*{firstName}"
                   required>

            <div class="text-danger"
                 th:if="${#fields.hasErrors('firstName')}"
                 th:errors="*{firstName}">
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label">Tên</label>

            <input type="text"
                   class="form-control"
                   th:field="*{lastName}"
                   required>

            <div class="text-danger"
                 th:if="${#fields.hasErrors('lastName')}"
                 th:errors="*{lastName}">
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label">Email</label>

            <input type="email"
                   class="form-control"
                   th:field="*{email}"
                   required>

            <div class="text-danger"
                 th:if="${#fields.hasErrors('email')}"
                 th:errors="*{email}">
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label">
                Số điện thoại
            </label>

            <input type="text"
                   class="form-control"
                   th:field="*{phone}">

            <div class="text-danger"
                 th:if="${#fields.hasErrors('phone')}"
                 th:errors="*{phone}">
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label">
                Mật khẩu
            </label>

            <input type="password"
                   class="form-control"
                   th:field="*{password}"
                   required>

            <div class="text-danger"
                 th:if="${#fields.hasErrors('password')}"
                 th:errors="*{password}">
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label">
                Nhập lại mật khẩu
            </label>

            <input type="password"
                   class="form-control"
                   th:field="*{confirmPassword}"
                   required>
        </div>

        <button type="submit"
                class="btn btn-primary w-100">

            Đăng ký

        </button>

    </form>

    <p class="mt-3 text-center">

        Đã có tài khoản?

        <a th:href="@{/login}">
            Đăng nhập
        </a>

    </p>

    </section>
</main>

<footer th:replace="~{fragments/footer :: footer}">
</footer>

<div th:replace="~{fragments/scripts :: scripts}">
</div>

</body>
</html>
