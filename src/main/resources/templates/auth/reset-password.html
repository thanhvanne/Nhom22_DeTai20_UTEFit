<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head('Đặt lại mật khẩu')}">
</head>

<body class="uf-theme uf-area-auth uf-page-auth-reset-password">

<header th:replace="~{fragments/header :: header}">
</header>

<main class="container py-5 uf-auth-shell" style="max-width: 600px;">
    <aside class="uf-auth-story" aria-label="Chào mừng đến UTEFit">
        <div class="uf-auth-brand" aria-hidden="true">UTE<span>FIT</span></div>
        <div><p class="uf-auth-statement">Mạnh mẽ hơn mỗi ngày.</p><p>Gói tập, lịch luyện tập và huấn luyện viên của bạn, trong một không gian.</p></div>
        <div class="uf-auth-story-foot">Đồng hành cùng mỗi buổi tập của bạn</div>
    </aside>
    <section class="uf-auth-form">

    <h2 class="mb-4">Đặt lại mật khẩu</h2>

    <div class="alert alert-success"
         th:if="${success}"
         th:text="${success}" data-uf-label>
    </div>

    <form th:action="@{/reset-password}"
          th:object="${form}"
          method="post">

        <div class="alert alert-danger"
             th:if="${#fields.hasGlobalErrors()}">

            <div th:each="err : ${#fields.globalErrors()}"
                 th:text="${err}">
            </div>

        </div>

        <div class="mb-3">

            <label class="form-label">Email</label>

            <input type="email"
                   class="form-control"
                   th:field="*{email}"
                   required>
        </div>

        <div class="mb-3">

            <label class="form-label">
                Mã OTP
            </label>

            <input type="text"
                   class="form-control"
                   th:field="*{code}"
                   maxlength="6"
                   inputmode="numeric"
                   required>

            <div class="text-danger"
                 th:if="${#fields.hasErrors('code')}"
                 th:errors="*{code}">
            </div>
        </div>

        <div class="mb-3">

            <label class="form-label">
                Mật khẩu mới
            </label>

            <input type="password"
                   class="form-control"
                   th:field="*{newPassword}"
                   required>
        </div>

        <div class="mb-3">

            <label class="form-label">
                Nhập lại mật khẩu mới
            </label>

            <input type="password"
                   class="form-control"
                   th:field="*{confirmPassword}"
                   required>
        </div>

        <button type="submit"
                class="btn btn-success w-100">

            Đổi mật khẩu

        </button>

    </form>

    </section>
</main>

<footer th:replace="~{fragments/footer :: footer}">
</footer>

<div th:replace="~{fragments/scripts :: scripts}">
</div>

</body>
</html>
