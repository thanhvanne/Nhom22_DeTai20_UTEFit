<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head('Đặt lại mật khẩu')}">
</head>

<body>

<header th:replace="~{fragments/header :: header}">
</header>

<main class="container py-5" style="max-width: 600px;">

    <h2 class="mb-4">Đặt lại mật khẩu</h2>

    <div class="alert alert-success"
         th:if="${success}"
         th:text="${success}">
    </div>

    <form th:action="@{/reset-password}"
          th:object="${form}"
          method="post">

        <div class="alert alert-danger"
             th:if="${#fields.hasGlobalErrors()}">

            <div th:each="err : ${#fields.globalErrors()}"
                 th:text="${err}">
            </div>

        </div>

        <div class="mb-3">

            <label class="form-label">Email</label>

            <input type="email"
                   class="form-control"
                   th:field="*{email}"
                   required>
        </div>

        <div class="mb-3">

            <label class="form-label">
                Mã OTP
            </label>

            <input type="text"
                   class="form-control"
                   th:field="*{code}"
                   maxlength="6"
                   inputmode="numeric"
                   required>

            <div class="text-danger"
                 th:if="${#fields.hasErrors('code')}"
                 th:errors="*{code}">
            </div>
        </div>

        <div class="mb-3">

            <label class="form-label">
                Mật khẩu mới
            </label>

            <input type="password"
                   class="form-control"
                   th:field="*{newPassword}"
                   required>
        </div>

        <div class="mb-3">

            <label class="form-label">
                Nhập lại mật khẩu mới
            </label>

            <input type="password"
                   class="form-control"
                   th:field="*{confirmPassword}"
                   required>
        </div>

        <button type="submit"
                class="btn btn-success w-100">

            Đổi mật khẩu

        </button>

    </form>

</main>

<footer th:replace="~{fragments/footer :: footer}">
</footer>

<div th:replace="~{fragments/scripts :: scripts}">
</div>

</body>
</html>
