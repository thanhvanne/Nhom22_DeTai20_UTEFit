<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('File quá lớn - UTEFit')}"></head>
<body>
<main class="container ut-page">
    <section class="ut-panel text-center">
        <h1>File vượt quá dung lượng cho phép</h1>
        <p>Video Review tối đa 50 MiB (52.428.800 byte) mỗi file; ảnh tối đa 5 MiB. Tổng dữ liệu một lần gửi không vượt quá 70 MiB.</p>
        <p>Vui lòng chọn file nhỏ hơn rồi gửi lại. Nội dung chưa được lưu từ lần gửi bị từ chối này.</p>
        <button class="btn btn-brand" type="button" onclick="history.back()">Quay lại biểu mẫu</button>
        <a class="btn btn-outline-warning" th:href="@{/}">Về trang chủ</a>
    </section>
</main>
</body>
</html>
