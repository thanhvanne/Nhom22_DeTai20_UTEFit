<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<header th:fragment="header">

    <nav class="navbar navbar-expand-lg navbar-dark utefit-navbar">

        <div class="container">

            <!-- Logo -->
            <a class="navbar-brand fw-bold utefit-logo"
               th:href="@{/}">
                <span class="brand-symbol">◆</span>
                UTE<span>FIT</span>
            </a>

            <!-- Toggler -->
            <button class="navbar-toggler"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#utefitNavbar"
                    aria-controls="utefitNavbar"
                    aria-expanded="false"
                    aria-label="Mở menu">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse"
                 id="utefitNavbar">

                <!-- NAVBAR CHO GUEST + MEMBER (KHÔNG PHẢI PT) -->
                <ul class="navbar-nav mx-auto gap-lg-3"
                    sec:authorize="!hasRole('PT')">

                    <li class="nav-item">
                        <a class="nav-link"
                           href="/#gioi-thieu">
                            Giới thiệu
                        </a>
                    </li>

                    <li class="nav-item dropdown">

                        <a class="nav-link dropdown-toggle"
                           href="#"
                           role="button"
                           data-bs-toggle="dropdown">
                            Chương trình tập
                        </a>

                        <ul class="dropdown-menu utefit-dropdown">

                            <li>
                                <a class="dropdown-item"
                                   href="/#giam-can">
                                    Giảm cân
                                </a>
                            </li>

                            <li>
                                <a class="dropdown-item"
                                   href="/#tang-co">
                                    Tăng cơ
                                </a>
                            </li>

                            <li>
                                <a class="dropdown-item"
                                   href="/#voc-dang">
                                    Cải thiện vóc dáng
                                </a>
                            </li>

                            <li>
                                <a class="dropdown-item"
                                   href="/#toan-dien">
                                    Fitness toàn diện
                                </a>
                            </li>

                            <li>
                                <a class="dropdown-item"
                                   href="/#kids">
                                    Kids Fitness
                                </a>
                            </li>

                        </ul>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link"
                           th:href="@{/trainers}">
                            Huấn luyện viên
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link"
                           href="/#bang-gia">
                            Bảng giá
                        </a>
                    </li>

                </ul>

                <!-- NAVBAR RIÊNG CHO PT -->
                <ul class="navbar-nav mx-auto gap-lg-3"
                    sec:authorize="hasRole('PT')">

                    <li class="nav-item">
                        <a class="nav-link"
                           th:href="@{/pt/profile}">
                            Hồ sơ cá nhân
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link"
                           th:href="@{/pt/trainer-requests}">
                            Yêu cầu từ Member
                        </a>
                    </li>

                    <li class="nav-item">
                        <!-- Placeholder lịch tập cá nhân -->
                        <a class="nav-link disabled"
                           href="#"
                           tabindex="-1"
                           aria-disabled="true">
                            Lịch tập cá nhân
                        </a>
                    </li>

                </ul>

                <!-- KHU VỰC AUTH -->

                <!-- Khách chưa đăng nhập -->
                <div sec:authorize="isAnonymous()"
                     class="d-flex align-items-center gap-2">

                    <a class="btn btn-outline-light btn-sm"
                       th:href="@{/login}">
                        Đăng nhập
                    </a>

                    <a class="btn btn-brand btn-sm"
                       th:href="@{/register}">
                        Đăng ký
                    </a>

                </div>

                <!-- Người đã đăng nhập (Member / PT / Admin) -->
                <div sec:authorize="isAuthenticated()"
                     class="d-flex align-items-center gap-2">

                    <!-- Member dashboard -->
                    <a sec:authorize="hasRole('MEMBER')"
                       class="btn btn-outline-light btn-sm"
                       th:href="@{/member/dashboard}">
                        Tài khoản
                    </a>

                    <!-- Member xem danh sách yêu cầu PT -->
                    <a sec:authorize="hasRole('MEMBER')"
                       class="btn btn-outline-light btn-sm"
                       th:href="@{/member/trainer-requests}">
                        Yêu cầu PT
                    </a>

                    <!-- PT dashboard -->
                    <a sec:authorize="hasRole('PT')"
                       class="btn btn-outline-light btn-sm"
                       th:href="@{/pt/dashboard}">
                        PT Dashboard
                    </a>

                    <!-- Admin (nếu có) -->
                    <a sec:authorize="hasRole('ADMIN')"
                       class="btn btn-outline-light btn-sm"
                       th:href="@{/admin}">
                        Admin
                    </a>

                    <!-- Logout -->
                    <form th:action="@{/auth/logout}"
                          method="post"
                          class="m-0">

                        <input type="hidden"
                               th:name="${_csrf.parameterName}"
                               th:value="${_csrf.token}">

                        <button type="submit"
                                class="btn btn-brand btn-sm">
                            Đăng xuất
                        </button>

                    </form>

                </div>

            </div>

        </div>

    </nav>

</header>

</html>
