
<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<header th:fragment="header">

    <nav class="navbar navbar-expand-lg navbar-dark utefit-navbar">
        <div class="container">

            <a class="navbar-brand fw-bold utefit-logo"
               th:href="@{/}">
                <span class="brand-symbol">◆</span>
                UTE<span>FIT</span>
            </a>

            <button class="navbar-toggler"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#utefitNavbar"
                    aria-controls="utefitNavbar"
                    aria-expanded="false"
                    aria-label="Mở menu">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse"
                 id="utefitNavbar">

                <ul class="navbar-nav mx-auto gap-lg-2">

                    <li class="nav-item">
                        <a class="nav-link"
                           th:href="@{/}">
                            Trang chủ
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link"
                           th:href="@{/branches}">
                            Chi nhánh
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link"
                           th:href="@{/membership-plans}">
                            Gói tập
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link"
                           th:href="@{/classes}">
                            Lớp tập
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link"
                           th:href="@{/trainers}">
                            Huấn luyện viên
                        </a>
                    </li>

                </ul>

                <div sec:authorize="isAnonymous()"
                     class="d-flex align-items-center gap-2">

                    <a class="btn btn-outline-light btn-sm"
                       th:href="@{/login}">
                        Đăng nhập
                    </a>

                    <a class="btn btn-brand btn-sm"
                       th:href="@{/register}">
                        Đăng ký
                    </a>
                </div>

                <div sec:authorize="isAuthenticated()"
                     class="d-flex align-items-center gap-2">

                    <a sec:authorize="hasRole('MEMBER')"
                       class="btn btn-outline-light btn-sm"
                       th:href="@{/member/dashboard}">
                        Tài khoản
                    </a>

                    <a sec:authorize="hasRole('PT')"
                       class="btn btn-outline-light btn-sm"
                       th:href="@{/pt/dashboard}">
                        PT Dashboard
                    </a>

                    <a sec:authorize="hasRole('ADMIN')"
                       class="btn btn-outline-light btn-sm"
                       th:href="@{/admin/dashboard}">
                        Admin
                    </a>

                    <form th:action="@{/auth/logout}"
                          method="post"
                          class="m-0">

                        <input type="hidden"
                               th:name="${_csrf.parameterName}"
                               th:value="${_csrf.token}">

                        <button type="submit"
                                class="btn btn-brand btn-sm">
                            Đăng xuất
                        </button>
                    </form>

                </div>

            </div>
        </div>
    </nav>

</header>
</html>
