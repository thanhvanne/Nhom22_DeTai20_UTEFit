<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:fragment="head(title)">

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title th:text="${title}" data-uf-label>UTEFit</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/images/utefit-favicon.svg}">

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
            crossorigin="anonymous">

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link
            href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700;800&display=swap"
            rel="stylesheet">

    <link rel="stylesheet"
          th:href="@{/css/style.css}">

    <link rel="stylesheet"
          th:href="@{/css/stage3.css}">

    <link rel="stylesheet"
          th:href="@{/css/reviews.css}">

    <!-- CSS Navbar mới và Member Dashboard -->
    <link rel="stylesheet"
          th:href="@{/css/member-dashboard.css}">

    <link rel="stylesheet" th:href="@{/css/utefit-timetable.css(v=1)}">
    <link rel="stylesheet" th:href="@{/css/utefit-premium.css(v=2)}">
    <link rel="stylesheet" th:href="@{/css/utefit-interface.css(v=1)}">
    <script defer th:src="@{/js/utefit-interface.js(v=1)}"></script>
    <link rel="stylesheet" th:href="@{/css/utefit-studio.css}">
    <script defer th:src="@{/js/utefit-studio.js}"></script>
    <link rel="stylesheet" th:href="@{/css/utefit-layouts.css(v=1)}">
    <link rel="stylesheet" th:href="@{/css/utefit-fields.css(v=1)}">
    <script defer th:src="@{/js/utefit-fields.js(v=1)}"></script>
    <script defer th:src="@{/js/utefit-accessibility.js(v=1)}"></script>
    <link rel="stylesheet" th:href="@{/css/utefit-public-account.css(v=1)}">
    <th:block th:replace="~{fragments/validation :: assets}"></th:block>
</head>
</html>
