<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head('PT Dashboard - UTEFit')}">
</head>

<body>

<header th:replace="~{fragments/header :: header}"></header>

<main class="container py-5">

    <div class="mb-4">

        <h1 class="fw-bold">
            PT Dashboard
        </h1>

        <p class="text-muted">
            Hệ thống quản lý dành cho huấn luyện viên UTEFit.
        </p>

    </div>

    <div class="row g-4">

        <div class="col-md-4">

            <div class="card shadow-sm h-100">

                <div class="card-body">

                    <h5>Hồ sơ cá nhân</h5>

                    <p>
                        Xem và cập nhật thông tin huấn luyện viên.
                    </p>

                    <a th:href="@{/pt/profile}"
                       class="btn btn-success">
                        Xem hồ sơ
                    </a>

                </div>

            </div>

        </div>

        <div class="col-md-4">

            <div class="card shadow-sm h-100">

                <div class="card-body">

                    <h5>Yêu cầu từ Member</h5>

                    <p>
                        Tiếp nhận yêu cầu tập luyện.
                    </p>

                    <span class="badge bg-secondary">
                        Sắp triển khai
                    </span>

                </div>

            </div>

        </div>

        <div class="col-md-4">

            <div class="card shadow-sm h-100">

                <div class="card-body">

                    <h5>Lịch tập cá nhân</h5>

                    <p>
                        Theo dõi và quản lý lịch tập với Member.
                    </p>

                    <span class="badge bg-secondary">
                        Sắp triển khai
                    </span>

                </div>

            </div>

        </div>

    </div>

</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>

<div th:replace="~{fragments/scripts :: scripts}"></div>

</body>
</html>
