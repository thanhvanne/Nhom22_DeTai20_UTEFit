<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Hồ sơ PT - UTEFit')}"></head>
<body class="uf-theme uf-area-pt uf-page-pt-profile-detail">
<header th:replace="~{fragments/header :: header}"></header>
<main class="staff-profile" id="utefit-content" tabindex="-1">
    <div class="staff-page-heading"><div><p class="staff-kicker">UTEFIT / COACH IDENTITY</p><h1>Hồ sơ huấn luyện viên</h1><p>Dấu ấn chuyên môn. Phong cách dẫn dắt.</p></div><a class="btn btn-outline-light" th:href="@{/pt/dashboard}">Về tổng quan ↗</a></div>
    <div class="alert alert-success" th:if="${successMessage}" th:text="${successMessage}" data-staff-server-success role="status"></div>
    <div class="alert alert-danger" th:if="${errorMessage}" th:text="${errorMessage}" data-staff-server-error role="alert"></div>
    <section class="staff-profile-hero" data-staff-reveal aria-labelledby="coach-name">
        <div class="staff-profile-portrait"><th:block th:replace="~{pt/fragments/layout :: avatar(${trainer.user != null ? trainer.user.avatarUrl : null})}"></th:block></div>
        <div class="staff-profile-identity"><p class="staff-kicker">PERSONAL TRAINER / COACH</p><h2 id="coach-name" th:text="${trainer.user != null ? trainer.user.fullName : 'Chưa cập nhật họ tên'}"></h2><p class="staff-profile-email" th:text="${trainer.user != null ? trainer.user.email : ''}"></p><a class="btn btn-primary" th:href="@{/pt/profile/edit}">Chỉnh sửa hồ sơ <span aria-hidden="true">↗</span></a></div>
        <div class="staff-profile-assignment"><span>CHI NHÁNH PHỤ TRÁCH</span><strong th:text="${trainer.branch != null ? @membershipDisplay.name(trainer.branch.name) : 'Chưa phân công'}"></strong><span class="staff-status" th:text="${trainer.active ? 'PT đang hoạt động' : 'PT chưa kích hoạt'}"></span></div>
    </section>
    <div class="staff-profile-grid">
        <section class="staff-profile-panel" data-staff-reveal><p class="staff-kicker">CHUYÊN MÔN</p><h2>Thế mạnh huấn luyện</h2><p class="staff-specialization" th:text="${!#strings.isEmpty(trainer.specialization) ? trainer.specialization : 'Chưa cập nhật chuyên môn.'}"></p><dl class="staff-detail-list"><div><dt>Kinh nghiệm</dt><dd th:text="${trainer.yearsExperience != null ? trainer.yearsExperience + ' năm' : 'Chưa cập nhật'}"></dd></div><div><dt>Chi nhánh</dt><dd th:text="${trainer.branch != null ? @membershipDisplay.name(trainer.branch.name) : 'Chưa phân công'}"></dd></div></dl></section>
        <section class="staff-profile-panel staff-profile-bio" data-staff-reveal><p class="staff-kicker">PHONG CÁCH CỦA BẠN</p><h2>Giới thiệu bản thân</h2><p th:text="${!#strings.isEmpty(trainer.bio) ? trainer.bio : 'Chưa có thông tin giới thiệu.'}"></p><a th:href="@{/pt/profile/edit}">Cập nhật giới thiệu <span aria-hidden="true">→</span></a></section>
    </div>
</main>
<dialog th:replace="~{pt/fragments/layout :: lightbox}"></dialog>
<footer th:replace="~{fragments/footer :: footer}"></footer>
<div th:replace="~{fragments/scripts :: scripts}"></div>
</body></html>
