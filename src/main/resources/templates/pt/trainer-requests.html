<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:replace="~{fragments/head :: head('Yêu cầu từ học viên - UTEFit')}"></head>

<body class="bg-dark uf-theme uf-area-pt uf-page-pt-trainer-requests">
<header th:replace="~{fragments/header :: header}"></header>

<main class="py-5">
    <style>
        .uf-page-pt-trainer-requests .pt-page-bg{
            background: var(--uf-canvas);
            min-height: calc(100vh - 140px);
        }
        .uf-page-pt-trainer-requests .pt-surface{
            background: var(--uf-surface);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 16px;
            box-shadow: 0 12px 30px rgba(0,0,0,.35);
        }
        .uf-page-pt-trainer-requests .pt-title{
            color: #fff;
        }
        .uf-page-pt-trainer-requests .pt-muted{
            color: var(--uf-muted) !important;
        }

        /* Table dark but clean */
        .uf-page-pt-trainer-requests .table-responsive > .pt-table{
            min-width: 1040px;
            --bs-table-bg: transparent;
            --bs-table-color: rgba(255,255,255,.92);
            --bs-table-border-color: var(--uf-border);
            --bs-table-striped-bg: rgba(255,255,255,.03);
            --bs-table-hover-bg: var(--uf-surface);
        }
        .uf-page-pt-trainer-requests .pt-table thead th{
            color: var(--uf-muted);
            border-bottom: 1px solid rgba(255,255,255,.12);
            font-weight: 600;
        }
        .uf-page-pt-trainer-requests .pt-table td:first-child{
            min-width: 170px;
        }
        .uf-page-pt-trainer-requests .pt-table td:nth-child(2){
            min-width: 220px;
            max-width: 320px;
            overflow-wrap: anywhere;
        }
        .uf-page-pt-trainer-requests .pt-table td:nth-child(n+3){
            white-space: nowrap;
        }

        /* Pagination dark */
        .uf-page-pt-trainer-requests .pagination .page-link{
            background: var(--uf-surface-raised);
            border-color: var(--uf-border);
            color: rgba(255,255,255,0.85);
        }
        .uf-page-pt-trainer-requests .pagination .page-item.active .page-link{
            background: var(--uf-accent);
            border-color: var(--uf-accent);
            color: #fff;
        }
        .uf-page-pt-trainer-requests .pagination .page-item.disabled .page-link{
            opacity: .45;
        }

        /* Alerts on dark */
        .uf-page-pt-trainer-requests .alert{
            border-radius: 14px;
            border: 1px solid rgba(255,255,255,0.12);
        }
    </style>

    <div class="pt-page-bg py-4">
        <div class="container">

            <h1 class="h3 mb-4 pt-title">
                Yêu cầu huấn luyện viên từ học viên
            </h1>

            <div th:if="${successMessage}" class="alert alert-success">
                <span th:text="${successMessage}" data-uf-label></span>
            </div>

            <div th:if="${errorMessage}" class="alert alert-danger">
                <span th:text="${errorMessage}" data-uf-label></span>
            </div>

            <div class="pt-surface p-3 p-md-4">
                <div th:if="${requestPage == null or requestPage.empty}">
                    <p class="mb-0 pt-muted">
                        Hiện chưa có yêu cầu nào từ học viên.
                    </p>
                </div>

                <div th:if="${requestPage != null and !requestPage.empty}">
                    <div class="table-responsive" tabindex="0" role="region" aria-label="Danh sách yêu cầu học viên, cuộn ngang để xem thêm">
                        <table class="table pt-table table-hover align-middle mb-0">
                            <thead>
                            <tr>
                                <th>Học viên</th>
                                <th>Nội dung</th>
                                <th>Trạng thái</th>
                                <th>Gửi lúc</th>
                                <th>Phản hồi lúc</th>
                                <th>Hành động</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="req : ${requestPage.content}">
                                <td>
                                    <div class="fw-semibold text-white"
                                         th:text="${req.memberName}">
                                        Tên học viên
                                    </div>
                                    <div class="small pt-muted"
                                         th:text="${req.memberEmail}">
                                        email
                                    </div>
                                </td>

                                <td th:text="${req.message != null ? req.message : '—'}">Nội dung</td>

                                <td>
                                    <span class="badge rounded-pill"
                                          th:classappend="${req.status.name() == 'PENDING'} ? ' bg-warning text-dark' :
                                                          (${req.status.name() == 'ACCEPTED'} ? ' bg-success' : ' bg-secondary')"
                                          th:text="${req.status}" data-uf-label>
                                        PENDING
                                    </span>
                                </td>

                                <td class="pt-muted"
                                    th:text="${#temporals.format(req.requestedAt, 'dd/MM/yyyy HH:mm')}">
                                    01/01/2026 10:00
                                </td>

                                <td class="pt-muted"
                                    th:text="${req.respondedAt != null ? #temporals.format(req.respondedAt, 'dd/MM/yyyy HH:mm') : '—'}">
                                    —
                                </td>

                                <td>
                                    <!-- PENDING: Accept/Reject -->
                                    <div th:if="${req.status.name() == 'PENDING'}" class="d-flex gap-2">

                                        <form th:action="@{'/pt/trainer-requests/' + ${req.id} + '/accept'}"
                                              method="post" class="d-inline">
                                            <input type="hidden"
                                                   th:name="${_csrf.parameterName}"
                                                   th:value="${_csrf.token}"/>
                                            <button type="submit" class="btn btn-success btn-sm">
                                                Chấp nhận
                                            </button>
                                        </form>

                                        <form th:action="@{'/pt/trainer-requests/' + ${req.id} + '/reject'}"
                                              method="post" class="d-inline">
                                            <input type="hidden"
                                                   th:name="${_csrf.parameterName}"
                                                   th:value="${_csrf.token}"/>
                                            <button type="submit" class="btn btn-outline-danger btn-sm">
                                                Từ chối
                                            </button>
                                        </form>

                                    </div>

                                    <!-- ACCEPTED -->
                                    <div th:if="${req.status.name() == 'ACCEPTED'}"
                                         class="d-flex flex-column align-items-start gap-1">
                                        <div class="pt-muted small">Đã xử lý</div>
                                        <div class="d-flex gap-2 mt-1">
                                            <a class="btn btn-outline-secondary btn-sm"
                                               th:href="@{/pt/personal-schedules/create(memberId=${req.memberId})}">
                                                Tạo lịch
                                            </a>
                                            <a class="btn btn-outline-primary btn-sm"
                                               th:href="@{/pt/chat/member/{memberId}(memberId=${req.memberId})}">
                                                Nhắn tin
                                            </a>
                                        </div>
                                    </div>

                                    <!-- REJECTED -->
                                    <div th:if="${req.status.name() == 'REJECTED'}"
                                         class="pt-muted small">
                                        Đã xử lý
                                    </div>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>

                    <!-- Pagination -->
                    <nav th:if="${requestPage.totalPages > 1}"
                         aria-label="Phân trang yêu cầu"
                         class="mt-3">
                        <ul class="pagination flex-wrap gap-1 mb-0">

                            <li class="page-item"
                                th:classappend="${requestPage.first} ? ' disabled'">
                                <a class="page-link"
                                   th:href="@{/pt/trainer-requests(page=${requestPage.number - 1})}">
                                    Trước
                                </a>
                            </li>

                            <li class="page-item"
                                th:each="i : ${#numbers.sequence(0, requestPage.totalPages - 1)}"
                                th:classappend="${i == requestPage.number} ? ' active'">
                                <a class="page-link"
                                   th:text="${i + 1}"
                                   th:href="@{/pt/trainer-requests(page=${i})}">
                                    1
                                </a>
                            </li>

                            <li class="page-item"
                                th:classappend="${requestPage.last} ? ' disabled'">
                                <a class="page-link"
                                   th:href="@{/pt/trainer-requests(page=${requestPage.number + 1})}">
                                    Sau
                                </a>
                            </li>

                        </ul>
                    </nav>

                </div>
            </div>

        </div>
    </div>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>
<div th:replace="~{fragments/scripts :: scripts}"></div>
</body>
</html>
