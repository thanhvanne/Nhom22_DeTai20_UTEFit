<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Tin nhắn - UTEFit PT')}"></head>
<body class="bg-dark text-white uf-theme uf-area-pt uf-page-pt-chat-list">
<header th:replace="~{fragments/header :: header}"></header>

<main class="container py-4">

    <h1 class="mb-2">Tin nhắn</h1>
    <p class="text-muted mb-4">Kết nối cùng học viên, chủ động đồng hành trong từng buổi tập.</p>

    <div th:if="${#lists.isEmpty(conversations)}" class="pt-empty staff-profile-panel">
        <h2>Không gian kết nối đã sẵn sàng</h2><p>Cuộc trò chuyện với học viên sẽ xuất hiện tại đây khi có kết nối huấn luyện.</p><a class="btn btn-outline-light" th:href="@{/pt/trainer-requests}">Xem yêu cầu hội viên</a>
    </div>

    <div class="list-group">
        <a th:each="c : ${conversations}"
           class="list-group-item list-group-item-action d-flex justify-content-between align-items-center"
           th:href="@{'/pt/chat/member/' + ${c.partnerUserId}}">
            <div>
                <div class="fw-semibold" th:text="${c.partnerName}">Tên hội viên</div>
                <div class="small text-muted" th:text="${c.lastMessagePreview}">
                    Nội dung tin nhắn gần nhất
                </div>
            </div>
            <div class="text-end">
                <div class="small text-muted"
                     th:text="${c.lastMessageAt != null ? #temporals.format(c.lastMessageAt, 'dd/MM HH:mm') : ''}">
                    21/10 18:00
                </div>
                <span th:if="${c.unreadCount > 0}"
                      class="badge bg-primary"
                      th:text="${c.unreadCount}">1</span>
            </div>
        </a>
    </div>

</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>
<div th:replace="~{fragments/scripts :: scripts}"></div>
</body>
</html>
