<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tin nhắn PT - UTEFIT</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/stage3.css}">
    <link rel="stylesheet" th:href="@{/css/member-dashboard.css}">
    <link rel="stylesheet" th:href="@{/css/utefit-chat.css(v=2)}">
</head>

<body class="uf-chat-page">

<header th:replace="~{fragments/header :: header}"></header>

<!-- Trang này chỉ xuất hiện khi PT chưa có hội thoại nào. -->
<main class="uf-chat-workspace"
      th:with="memberSide=false,activeConversationId=${null},acceptedTrainers=${null}">

    <aside th:replace="~{fragments/chat-sidebar :: sidebar}"></aside>

    <section class="uf-chat-main" aria-label="Nội dung hội thoại">
        <div class="uf-chat-empty-main">
            <div>
                <div class="uf-chat-empty-symbol"
                     aria-hidden="true">✉</div>

                <h2>Chưa có cuộc trò chuyện</h2>

                <p>
                    Khi có hội thoại với Member đã được chấp nhận yêu cầu PT,
                    tin nhắn sẽ hiển thị tại đây.
                </p>

                <a class="btn btn-brand"
                   th:href="@{/pt/trainer-requests}">
                    Xem yêu cầu Member
                </a>
            </div>
        </div>
    </section>

</main>

<div th:replace="~{fragments/scripts :: scripts}"></div>
<script th:src="@{/js/utefit-chat-sidebar.js(v=1)}"></script>

</body>
</html>
