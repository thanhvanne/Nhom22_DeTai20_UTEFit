<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Lịch PT cá nhân - UTEFit')}"></head>
<body>
<header th:replace="~{fragments/header :: header}"></header>
<main class="container py-5">
    <h1 class="h3">Lịch tập cá nhân 1:1 của tôi</h1>
    <p>Chỉ tạo lịch cho Member có yêu cầu ACCEPTED và Membership hợp lệ tại chi nhánh PT.</p>
    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>
    <form th:action="@{/pt/personal-schedules}" method="get" class="row g-2 mb-4">
        <div class="col-md-4"><label for="fromDate">Từ ngày</label><input class="form-control" type="date" id="fromDate" name="fromDate" th:value="${fromDate}" required></div>
        <div class="col-md-4"><label for="toDate">Đến ngày</label><input class="form-control" type="date" id="toDate" name="toDate" th:value="${toDate}" required></div>
        <div class="col-md-4 align-self-end"><button class="btn btn-primary">Lọc</button></div>
    </form>
    <div class="table-responsive">
        <table class="table table-striped align-middle">
            <thead><tr><th>Member</th><th>Tiêu đề</th><th>Ngày</th><th>Giờ</th><th>Chi nhánh</th><th>Trạng thái</th><th>Thao tác</th></tr></thead>
            <tbody>
            <tr th:each="s : ${schedules}">
                <td th:text="${s.memberName}"></td><td th:text="${s.title}"></td>
                <td th:text="${s.scheduleDate}"></td><td th:text="|${s.startTime} - ${s.endTime}|"></td>
                <td th:text="${s.branchName}"></td><td th:text="${s.status}"></td>
                <td>
                    <form th:if="${s.status == 'SCHEDULED'}" th:action="@{/pt/personal-schedules/{id}/cancel(id=${s.id})}" method="post" class="d-inline">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <button class="btn btn-outline-danger btn-sm">Hủy</button>
                    </form>
                    <form th:if="${s.status == 'SCHEDULED'}" th:action="@{/pt/personal-schedules/{id}/complete(id=${s.id})}" method="post" class="d-inline">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <button class="btn btn-outline-success btn-sm">Đã hoàn thành</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
    <div th:if="${#lists.isEmpty(schedules)}" class="alert alert-info">Chưa có lịch PT 1:1 trong khoảng ngày đã chọn.</div>
</main>
<footer th:replace="~{fragments/footer :: footer}"></footer>
<div th:replace="~{fragments/scripts :: scripts}"></div>
</body></html>
