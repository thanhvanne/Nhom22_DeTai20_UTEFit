<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Tin nhắn với PT - UTEFIT</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          th:href="@{/css/style.css}">

    <link rel="stylesheet"
          th:href="@{/css/stage3.css}">

    <link rel="stylesheet"
          th:href="@{/css/member-dashboard.css}">

    <link rel="stylesheet"
          th:href="@{/css/utefit-chat.css(v=2)}">
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/utefit-premium.css(v=2)}">
    <link rel="stylesheet" th:href="@{/css/utefit-interface.css(v=1)}">
    <script defer th:src="@{/js/utefit-interface.js(v=1)}"></script>
</head>

<body class="uf-chat-page uf-theme uf-area-member uf-page-member-chats">

<header th:replace="~{fragments/header :: header}"></header>

<main class="uf-chat-workspace"
      th:with="memberSide=true, activeConversationId=${null}">

    <!-- Sidebar Member -->
    <aside th:replace="~{fragments/chat-sidebar :: sidebar}"></aside>

    <!-- Chưa chọn hội thoại -->
    <section class="uf-chat-main"
             aria-label="Nội dung hội thoại">

        <div class="uf-chat-error"
             th:if="${errorMessage}"
             role="alert"
             th:text="${errorMessage}" data-uf-label>
        </div>

        <div class="uf-chat-empty-main">

            <div>

                <div class="uf-chat-empty-symbol"
                     aria-hidden="true">
                    ✉
                </div>

                <h2>
                    Chọn một cuộc trò chuyện
                </h2>

                <p>
                    Chọn PT bên trái để xem tin nhắn
                    và tiếp tục trao đổi.
                </p>

                <p th:if="${#lists.isEmpty(conversations)}">

                    <a class="btn btn-brand"
                       th:href="@{/member/trainer-requests}">
                        Xem yêu cầu PT
                    </a>

                </p>

            </div>

        </div>

    </section>

</main>

<div th:replace="~{fragments/scripts :: scripts}"></div>

<script th:src="@{/js/utefit-chat-sidebar.js(v=1)}"></script>

</body>
</html>
