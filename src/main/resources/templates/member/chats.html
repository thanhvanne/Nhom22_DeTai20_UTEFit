<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{member/fragments/layout :: head('Tin nhắn với PT - UTEFit')}"></head>

<body class="uf-chat-page uf-theme uf-area-member uf-page-member-chats uf-member">

<header th:replace="~{member/fragments/layout :: header}"></header>

<main class="uf-chat-workspace"
      th:with="memberSide=true, activeConversationId=${null}">

    <!-- Sidebar Member -->
    <aside th:replace="~{member/fragments/chat-sidebar :: sidebar}"></aside>

    <!-- Chưa chọn hội thoại -->
    <section class="uf-chat-main"
             aria-label="Nội dung hội thoại">

        <div class="uf-chat-error"
             th:if="${errorMessage}"
             role="alert"
             th:text="${errorMessage}" data-uf-label>
        </div>

        <div class="uf-chat-empty-main">

            <div>

                <div class="uf-chat-empty-symbol"
                     aria-hidden="true">
                    <svg viewBox="0 0 48 48" width="40" height="40" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="6" y="11" width="36" height="27" rx="4"/><path d="m7 14 17 13 17-13"/></svg>
                </div>

                <h2>
                    Chọn một cuộc trò chuyện
                </h2>

                <p>
                    Chọn PT bên trái để xem tin nhắn
                    và tiếp tục trao đổi.
                </p>

                <p th:if="${#lists.isEmpty(conversations)}">

                    <a class="btn btn-brand"
                       th:href="@{/member/trainer-requests}">
                        Xem yêu cầu PT
                    </a>

                </p>

            </div>

        </div>

    </section>

</main>

<div th:replace="~{member/fragments/layout :: scripts}"></div>

<script th:src="@{/js/utefit-chat-sidebar.js(v=1)}"></script>

</body>
</html>
