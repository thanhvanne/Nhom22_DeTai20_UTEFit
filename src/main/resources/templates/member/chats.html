<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Tin nhắn PT - UTEFit')}"></head>
<body>
<header th:replace="~{fragments/header :: header}"></header>
<main class="container ut-page">
    <div class="d-flex justify-content-between flex-wrap gap-3 align-items-center mb-4">
        <div>
            <h1 class="ut-page-title">Chat <span>huấn luyện viên</span></h1>
            <p class="ut-subtitle mb-0">Chỉ chat với PT đã chấp nhận yêu cầu.</p>
        </div>
        <a class="btn btn-outline-light" th:href="@{/member/trainer-requests}">Yêu cầu PT</a>
    </div>
    <div class="alert alert-danger" th:if="${errorMessage}" th:text="${errorMessage}"></div>
    <h2 class="h4 mb-3">Cuộc trò chuyện</h2>
    <div class="row g-3 mb-5">
        <div th:each="c : ${conversations}" class="col-md-6">
            <div class="ut-panel h-100">
                <h3 class="h5" th:text="${c.partnerName}"></h3>
                <p class="ut-subtitle" th:text="${c.lastMessagePreview ?: 'Chưa có tin nhắn'}"></p>
                <p class="small" th:if="${c.lastMessageAt != null}"
                   th:text="${#temporals.format(c.lastMessageAt, 'dd/MM/yyyy HH:mm')}"></p>
                <p class="small" th:if="${c.unreadCount > 0}"
                   th:text="${c.unreadCount + ' tin chưa đọc'}"></p>
                <a th:href="@{/member/chats/{id}(id=${c.conversationId})}" class="btn btn-brand">Mở chat</a>
            </div>
        </div>
    </div>
    <h2 class="h4 mb-3">PT đã nhận yêu cầu</h2>
    <div class="row g-3">
        <div th:each="pt : ${acceptedTrainers}" class="col-md-6 col-lg-4">
            <div class="ut-panel h-100">
                <h3 class="h5" th:text="${pt.name}"></h3>
                <p class="small ut-subtitle" th:text="${pt.email}"></p>
                <form th:action="@{/member/chats/start/{id}(id=${pt.id})}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <button type="submit" class="btn btn-brand">Bắt đầu / mở chat</button>
                </form>
            </div>
        </div>
    </div>
    <div th:if="${#lists.isEmpty(acceptedTrainers)}" class="ut-panel mt-3">
        <p>Chưa có yêu cầu PT nào được ACCEPTED.</p>
        <a class="btn btn-outline-light" th:href="@{/trainers}">Tìm PT</a>
    </div>
</main>
<footer th:replace="~{fragments/footer :: footer}"></footer>
<div th:replace="~{fragments/scripts :: scripts}"></div>
</body>
</html>
