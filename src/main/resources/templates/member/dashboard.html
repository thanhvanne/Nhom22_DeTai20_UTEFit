<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head('Member Dashboard')}">
</head>

<body>

<header th:replace="~{fragments/header :: header}">
</header>

<main class="container py-5 member-shell">

    <h2>UTEFit - Member Dashboard</h2>

    <div class="alert alert-success mt-4">

        Bạn đã đăng nhập thành công
        với quyền MEMBER.

    </div>

    <p>
        Đây là trang demo để kiểm tra
        Spring Security và JWT.
    </p>

    <p>
        MEMBER không được truy cập
        <code>/admin/**</code>
        hoặc
        <code>/pt/**</code>.
    </p>

    <form th:action="@{/auth/logout}" method="post">

        <input type="hidden"
               th:name="${_csrf.parameterName}"
               th:value="${_csrf.token}">

        <button type="submit" class="btn btn-danger">
            Đăng xuất
        </button>

    </form>

</main>

<footer th:replace="~{fragments/footer :: footer}">
</footer>

<div th:replace="~{fragments/scripts :: scripts}">
</div>

</body>
</html>
