<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head('Hồ sơ hội viên - UTEFit')}">
</head>

<body class="uf-theme uf-area-member uf-page-member-profile">

<header th:replace="~{fragments/header :: header}">
</header>

<main class="container ut-page">

    <div class="d-flex flex-wrap align-items-center
                justify-content-between gap-3 mb-4">

        <div>
            <h1 class="ut-page-title">
                Hồ sơ <span>hội viên</span>
            </h1>
            <p class="ut-subtitle mb-0">
                Cập nhật thông tin và bảo mật tài khoản.
            </p>
        </div>

        <a class="btn btn-outline-light"
           th:href="@{/member/dashboard}">
            Tổng quan
        </a>
    </div>

    <div th:if="${success}"
         class="alert alert-success"
         th:text="${success}" data-uf-label>
    </div>

    <div th:if="${error}"
         class="alert alert-danger"
         th:text="${error}" data-uf-label>
    </div>

    <div class="row g-4">

        <div class="col-lg-4">

            <div class="ut-panel text-center">

                <img th:if="${profile.avatarUrl != null}"
                     th:src="${profile.avatarUrl}"
                     alt="Ảnh đại diện"
                     class="ut-avatar mx-auto">

                <div th:unless="${profile.avatarUrl != null}"
                     class="ut-avatar-placeholder mx-auto">
                    ◆
                </div>

                <h3 class="mt-3"
                    th:text="${profile.firstName + ' ' + profile.lastName}" data-uf-label>
                    Hội viên
                </h3>

                <p class="ut-subtitle"
                   th:text="${profile.email}">
                    email@example.com
                </p>

                <form th:action="@{/member/profile/avatar}"
                      method="post"
                      enctype="multipart/form-data"
                      class="text-start mt-4">

                    <input type="hidden"
                           th:name="${_csrf.parameterName}"
                           th:value="${_csrf.token}">

                    <label class="form-label">
                        Ảnh đại diện mới
                    </label>

                    <input type="file"
                           name="avatar"
                           class="form-control"
                           accept="image/jpeg,image/png,image/gif"
                           required>

                    <small class="text-secondary d-block mt-2">
                        JPG, PNG hoặc GIF (tối đa 5 MB).
                    </small>

                    <button class="btn btn-brand w-100 mt-3"
                            type="submit">
                        Cập nhật ảnh đại diện
                    </button>
                </form>

            </div>
        </div>

        <div class="col-lg-8">

            <div class="ut-panel mb-4">

                <h3 class="mb-4">
                    Thông tin cá nhân
                </h3>

                <form th:action="@{/member/profile}"
                      th:object="${profileForm}"
                      method="post">

                    <input type="hidden"
                           th:name="${_csrf.parameterName}"
                           th:value="${_csrf.token}">

                    <div class="row g-3">

                        <div class="col-md-6">
                            <label class="form-label">
                                Họ
                            </label>

                            <input type="text"
                                   th:field="*{firstName}"
                                   class="form-control"
                                   maxlength="50"
                                   required>

                            <div class="text-danger small mt-1"
                                 th:errors="*{firstName}">
                            </div>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label">
                                Tên
                            </label>

                            <input type="text"
                                   th:field="*{lastName}"
                                   class="form-control"
                                   maxlength="50"
                                   required>

                            <div class="text-danger small mt-1"
                                 th:errors="*{lastName}">
                            </div>
                        </div>

                        <div class="col-12">
                            <label class="form-label">
                                Số điện thoại
                            </label>

                            <input type="tel"
                                   th:field="*{phone}"
                                   class="form-control"
                                   maxlength="11">

                            <div class="text-danger small mt-1"
                                 th:errors="*{phone}">
                            </div>
                        </div>

                        <div class="col-12">
                            <label class="form-label">
                                Email
                            </label>

                            <input type="email"
                                   class="form-control"
                                   th:value="${profile.email}"
                                   readonly>

                            <small class="text-secondary">
                                Không thể thay đổi email tại đây.
                            </small>
                        </div>

                    </div>

                    <button class="btn btn-brand mt-4"
                            type="submit">
                        Lưu thay đổi
                    </button>

                </form>

            </div>

            <div class="ut-panel">

                <h3 class="mb-4">
                    Đổi mật khẩu
                </h3>

                <form th:action="@{/member/profile/password}"
                      th:object="${passwordForm}"
                      method="post">

                    <input type="hidden"
                           th:name="${_csrf.parameterName}"
                           th:value="${_csrf.token}">

                    <div class="mb-3">

                        <label class="form-label">
                            Mật khẩu hiện tại
                        </label>

                        <input type="password"
                               th:field="*{currentPassword}"
                               class="form-control"
                               autocomplete="current-password"
                               required>

                        <div class="text-danger small mt-1"
                             th:errors="*{currentPassword}">
                        </div>
                    </div>

                    <div class="mb-3">

                        <label class="form-label">
                            Mật khẩu mới
                        </label>

                        <input type="password"
                               th:field="*{newPassword}"
                               class="form-control"
                               minlength="8"
                               autocomplete="new-password"
                               required>

                        <div class="text-danger small mt-1"
                             th:errors="*{newPassword}">
                        </div>
                    </div>

                    <div class="mb-3">

                        <label class="form-label">
                            Xác nhận mật khẩu mới
                        </label>

                        <input type="password"
                               th:field="*{confirmPassword}"
                               class="form-control"
                               autocomplete="new-password"
                               required>

                        <div class="text-danger small mt-1"
                             th:errors="*{confirmPassword}">
                        </div>
                    </div>

                    <button class="btn btn-outline-light"
                            type="submit">
                        Đổi mật khẩu
                    </button>

                    <p class="ut-subtitle mt-3 mb-0">
                        Sau khi đổi mật khẩu,
                        bạn cần đăng nhập lại.
                    </p>

                </form>

            </div>

        </div>
    </div>

</main>

<footer th:replace="~{fragments/footer :: footer}">
</footer>

<div th:replace="~{fragments/scripts :: scripts}">
</div>

</body>
</html>
