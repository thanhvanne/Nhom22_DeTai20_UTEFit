<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Yêu cầu PT của tôi - UTEFit')}"></head>
<body>
<header th:replace="~{fragments/header :: header}"></header>
<main class="container py-5">
    <div class="d-flex justify-content-between flex-wrap gap-3 align-items-center mb-4">
        <div>
            <h1 class="h3">Yêu cầu huấn luyện viên</h1>
            <p class="text-muted mb-0">PT phải chấp nhận yêu cầu trước khi tạo lịch 1:1 và chat.</p>
        </div>
        <a th:href="@{/trainers}" class="btn btn-primary">Tìm PT</a>
    </div>
    <div class="alert alert-success" th:if="${successMessage}" th:text="${successMessage}"></div>
    <div class="alert alert-danger" th:if="${errorMessage}" th:text="${errorMessage}"></div>
    <div class="table-responsive bg-white rounded shadow-sm p-3">
        <table class="table table-striped align-middle">
            <thead><tr>
                <th>Huấn luyện viên</th><th>Lời nhắn</th><th>Trạng thái</th>
                <th>Ngày gửi</th><th>Phản hồi</th><th>Hành động</th>
            </tr></thead>
            <tbody>
            <tr th:each="req : ${requestPage.content}">
                <td>
                    <strong th:text="${req.trainerName}"></strong>
                    <small class="d-block text-muted" th:text="${req.trainerEmail}"></small>
                </td>
                <td th:text="${req.message ?: '—'}"></td>
                <td>
                    <span class="badge" th:text="${req.status}"
                          th:classappend="${req.status.name() == 'ACCEPTED'} ? ' bg-success' : (${req.status.name() == 'PENDING'} ? ' bg-warning text-dark' : ' bg-secondary')"></span>
                </td>
                <td th:text="${#temporals.format(req.requestedAt, 'dd/MM/yyyy HH:mm')}"></td>
                <td th:text="${req.respondedAt != null ? #temporals.format(req.respondedAt, 'dd/MM/yyyy HH:mm') : '—'}"></td>
                <td>
                    <div th:if="${req.status.name() == 'ACCEPTED'}" class="d-flex flex-column gap-2">
                        <form th:action="@{/member/chats/start/{id}(id=${req.trainerId})}" method="post">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                            <button class="btn btn-primary btn-sm" type="submit">Nhắn tin PT</button>
                        </form>
                        <a th:href="@{/member/pt-schedules}" class="btn btn-outline-primary btn-sm">Lịch PT 1:1</a>
                    </div>
                    <span th:if="${req.status.name() == 'PENDING'}" class="text-muted small">Chờ PT phản hồi</span>
                    <span th:if="${req.status.name() == 'REJECTED'}" class="text-muted small">PT đã từ chối</span>
                    <span th:if="${req.status.name() == 'CANCELLED'}" class="text-muted small">Đã hủy</span>
                </td>
            </tr>
            </tbody>
        </table>
        <p class="text-muted" th:if="${requestPage.empty}">Chưa có yêu cầu PT nào.</p>
        <nav th:if="${requestPage.totalPages > 1}" aria-label="Phân trang yêu cầu PT">
            <ul class="pagination">
                <li class="page-item" th:each="i : ${#numbers.sequence(0,requestPage.totalPages - 1)}"
                    th:classappend="${i == requestPage.number} ? ' active'">
                    <a class="page-link" th:href="@{/member/trainer-requests(page=${i})}" th:text="${i + 1}"></a>
                </li>
            </ul>
        </nav>
    </div>
</main>
<footer th:replace="~{fragments/footer :: footer}"></footer>
<div th:replace="~{fragments/scripts :: scripts}"></div>
</body>
</html>
