<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{member/fragments/layout :: head('Yêu cầu PT của tôi - UTEFit')}"></head>
<body class="uf-theme uf-area-member uf-page-member-trainer-requests uf-member">
<header th:replace="~{member/fragments/layout :: header}"></header>
<main class="container py-5">
    <div class="d-flex justify-content-between flex-wrap gap-3 align-items-center mb-4">
        <div>
            <h1 class="h3">Yêu cầu huấn luyện viên</h1>
            <p class="text-muted mb-0">PT phải chấp nhận yêu cầu trước khi tạo lịch 1:1 và chat.</p>
        </div>
        <a th:href="@{/trainers}" class="btn btn-primary">Tìm PT</a>
    </div>
    <div class="alert alert-success" th:if="${successMessage}" th:text="${successMessage}" data-uf-label></div>
    <div class="alert alert-danger" th:if="${errorMessage}" th:text="${errorMessage}" data-uf-label></div>
    <div class="table-responsive bg-white rounded member-surface p-3">
        <table role="table" class="table  align-middle">
            <thead role="rowgroup"><tr role="row">
                <th role="columnheader" scope="col">Huấn luyện viên</th><th role="columnheader" scope="col">Lời nhắn</th><th role="columnheader" scope="col">Trạng thái</th>
                <th role="columnheader" scope="col">Ngày gửi</th><th role="columnheader" scope="col">Phản hồi</th><th role="columnheader" scope="col">Hành động</th>
            </tr></thead>
            <tbody role="rowgroup">
            <tr role="row" th:each="req : ${requestPage.content}">
                <td role="cell" data-label="Huấn luyện viên">
                    <strong th:text="${req.trainerName}"></strong>
                    <small class="d-block text-muted" th:text="${req.trainerEmail}"></small>
                </td>
                <td role="cell" data-label="Lời nhắn" th:text="${req.message ?: '—'}"></td>
                <td role="cell" data-label="Trạng thái">
                    <span class="badge" th:text="${req.status}"
                          th:classappend="${req.status.name() == 'ACCEPTED'} ? ' bg-success' : (${req.status.name() == 'PENDING'} ? ' bg-warning text-dark' : ' bg-secondary')" data-uf-label></span>
                </td>
                <td role="cell" data-label="Ngày gửi" th:text="${#temporals.format(req.requestedAt, 'dd/MM/yyyy HH:mm')}"></td>
                <td role="cell" data-label="Phản hồi" th:text="${req.respondedAt != null ? #temporals.format(req.respondedAt, 'dd/MM/yyyy HH:mm') : '—'}"></td>
                <td role="cell" data-label="Hành động">
                    <div th:if="${req.status.name() == 'ACCEPTED'}" class="d-flex flex-column gap-2">
                        <form th:action="@{/member/chats/start/{id}(id=${req.trainerId})}" method="post">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                            <button class="btn btn-primary btn-sm" type="submit">Nhắn tin PT</button>
                        </form>
                        <a th:href="@{/member/pt-schedules}" class="btn btn-outline-primary btn-sm">Lịch PT 1:1</a>
                    </div>
                    <form th:if="${req.status.name() == 'PENDING'}"
                          th:action="@{/member/trainer-requests/{id}/cancel(id=${req.id})}"
                          method="post" onsubmit="return confirm('Hủy yêu cầu PT này?');">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <button class="btn btn-outline-danger btn-sm">Hủy yêu cầu</button>
                    </form>
                    <span th:if="${req.status.name() == 'REJECTED'}" class="text-muted small">PT đã từ chối</span>
                    <span th:if="${req.status.name() == 'CANCELLED'}" class="text-muted small">Đã hủy</span>
                </td>
            </tr>
            </tbody>
        </table>
        <p class="text-muted" th:if="${requestPage.empty}">Chưa có yêu cầu PT nào.</p>
        <nav th:if="${requestPage.totalPages > 1}" aria-label="Phân trang yêu cầu PT">
            <ul class="pagination">
                <li class="page-item" th:each="i : ${#numbers.sequence(0,requestPage.totalPages - 1)}"
                    th:classappend="${i == requestPage.number} ? ' active'">
                    <a class="page-link" th:href="@{/member/trainer-requests(page=${i})}" th:text="${i + 1}"></a>
                </li>
            </ul>
        </nav>
    </div>
</main>
<footer th:replace="~{member/fragments/layout :: footer}"></footer>
<div th:replace="~{member/fragments/layout :: scripts}"></div>
</body>
</html>
