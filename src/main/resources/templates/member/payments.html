
<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{member/fragments/layout :: head('Lịch sử thanh toán - UTEFit')}">
</head>

<body class="uf-theme uf-area-member uf-page-member-payments uf-member">

<header th:replace="~{member/fragments/layout :: header}">
</header>

<main class="container ut-page">

    <div class="d-flex justify-content-between
                align-items-center flex-wrap gap-3 mb-4">

        <div>
            <h1 class="ut-page-title">
                Lịch sử <span>thanh toán</span>
            </h1>

            <p class="ut-subtitle mb-0">
                Theo dõi các giao dịch gói tập của bạn.
            </p>
        </div>

        <a class="btn btn-outline-light"
           th:href="@{/member/memberships}">
            Gói tập của tôi
        </a>

    </div>

    <div class="ut-panel">

        <div class="table-responsive">

            <table role="table" class="table ut-table align-middle">

                <thead role="rowgroup">
                <tr role="row">
                    <th role="columnheader" scope="col">Mã GD</th>
                    <th role="columnheader" scope="col">Gói tập</th>
                    <th role="columnheader" scope="col">Số tiền</th>
                    <th role="columnheader" scope="col">Phương thức</th>
                    <th role="columnheader" scope="col">Trạng thái</th>
                    <th role="columnheader" scope="col">Ngày tạo</th>
                    <th role="columnheader" scope="col">Ngày thanh toán</th>
                    <th role="columnheader" scope="col">Mã giao dịch</th>
                </tr>
                </thead>

                <tbody role="rowgroup">

                <tr role="row" th:each="p : ${payments}">

                    <td role="cell" data-label="Mã GD" th:text="${p.id}">1</td>

                    <td role="cell" data-label="Gói tập" th:text="${@membershipDisplay.name(p.planName)}">
                        Gói tập
                    </td>

                    <td role="cell" data-label="Số tiền" th:text="${@membershipDisplay.money(p.amount)}">
                        0 VND
                    </td>

                    <td role="cell" data-label="Phương thức" th:text="${p.method}" data-uf-label>
                        tiền mặt
                    </td>

                    <td role="cell" data-label="Trạng thái">
                        <span class="ut-status"
                              th:classappend="${p.status}"
                              th:text="${@membershipDisplay.paymentStatus(p.status)}" data-uf-label>
                            PENDING
                        </span>
                    </td>

                    <td role="cell" data-label="Ngày tạo" th:text="${#temporals.format(p.createdAt, 'dd/MM/yyyy HH:mm')}">
                        01/01/2026
                    </td>

                    <td role="cell" data-label="Ngày thanh toán">
                        <span th:if="${p.paidAt != null}"
                              th:text="${#temporals.format(p.paidAt, 'dd/MM/yyyy HH:mm')}">
                        </span>

                        <span th:unless="${p.paidAt != null}">
                            Chưa thanh toán
                        </span>
                    </td>

                    <td role="cell" data-label="Mã giao dịch">
                        <span th:text="${p.transactionCode ?: '-'}">-</span>
                        <a th:if="${p.method == 'SEPAY'}" class="btn btn-outline-warning btn-sm d-block mt-1" th:href="@{/member/payments/{id}/sepay(id=${p.id})}">Xem VietQR / trạng thái</a>
                    </td>

                </tr>

                </tbody>

            </table>

        </div>

        <div th:if="${#lists.isEmpty(payments)}"
             class="text-center ut-subtitle py-4">
            Chưa có giao dịch nào.
        </div>

    </div>

</main>

<footer th:replace="~{member/fragments/layout :: footer}">
</footer>

<div th:replace="~{member/fragments/layout :: scripts}">
</div>

</body>
</html>
