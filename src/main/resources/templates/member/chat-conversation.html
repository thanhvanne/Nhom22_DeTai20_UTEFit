<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Chat PT 1:1 - UTEFit')}"></head>
<body>
<header th:replace="~{fragments/header :: header}"></header>
<main class="container py-5">
    <div id="memberChat" class="mx-auto"
         style="max-width: 820px"
         th:attr="data-conversation-id=${chat.conversationId},
                  data-current-user-id=${chat.currentUserId},
                  data-messages-url=@{/member/chats/{id}/messages(id=${chat.conversationId})},
                  data-send-url=@{/member/chats/{id}/send(id=${chat.conversationId})},
                  data-ws-url=@{/ws}">
        <div class="d-flex justify-content-between flex-wrap gap-2 mb-3 align-items-center">
            <h1 class="h4 mb-0">Trò chuyện với <span th:text="${chat.partnerName}"></span></h1>
            <a th:href="@{/member/chats}" class="btn btn-outline-secondary">Danh sách chat</a>
        </div>
        <div class="card border-0 shadow">
            <div class="card-header bg-dark text-white py-3">
                <strong th:text="${chat.partnerName}"></strong>
                <span id="chatConnection" class="small ms-2">Đang kết nối…</span>
            </div>
            <div id="chatMessages" class="card-body d-flex flex-column gap-2"
                 role="log" aria-live="polite"
                 style="height: 440px; overflow-y: auto; background: #f8fafc; color: #111827">
                <p class="text-muted">Đang tải lịch sử tin nhắn…</p>
            </div>
            <div class="card-footer bg-white">
                <div id="chatError" role="alert" class="text-danger small mb-2" hidden></div>
                <form id="chatForm" class="d-flex gap-2" autocomplete="off">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <input name="content" id="chatInput" class="form-control"
                           maxlength="2000" placeholder="Nhập tin nhắn cho PT…" required>
                    <button id="chatSend" type="submit" class="btn btn-primary">Gửi</button>
                </form>
                <p class="small text-muted mt-2 mb-0">Tin nhắn lưu trong database; khi mất kết nối realtime, lịch sử vẫn tự cập nhật.</p>
            </div>
        </div>
    </div>
</main>
<footer th:replace="~{fragments/footer :: footer}"></footer>
<div th:replace="~{fragments/scripts :: scripts}"></div>
<script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
<script th:src="@{/js/member-chat.js}"></script>
</body>
</html>
