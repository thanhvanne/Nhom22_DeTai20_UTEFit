<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Trò chuyện với PT - UTEFIT</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          th:href="@{/css/style.css}">

    <link rel="stylesheet"
          th:href="@{/css/stage3.css}">

    <link rel="stylesheet"
          th:href="@{/css/member-dashboard.css}">

    <link rel="stylesheet"
          th:href="@{/css/utefit-chat.css(v=2)}">
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/utefit-premium.css(v=2)}">
    <link rel="stylesheet" th:href="@{/css/utefit-interface.css(v=1)}">
    <script defer th:src="@{/js/utefit-interface.js(v=1)}"></script>
</head>

<body class="uf-chat-page uf-theme uf-area-member uf-page-member-chat-conversation">

<header th:replace="~{fragments/header :: header}"></header>

<main class="uf-chat-workspace has-active-chat"
      th:with="memberSide=true,
               activeConversationId=${chat.conversationId}">

    <!-- Danh sách hội thoại bên trái -->
    <aside th:replace="~{fragments/chat-sidebar :: sidebar}"></aside>

    <!-- Hội thoại hiện tại -->
    <section class="uf-chat-main"
             id="memberChat"
             aria-label="Cuộc trò chuyện với PT"

             th:attr="data-conversation-id=${chat.conversationId},
                      data-current-user-id=${chat.currentUserId},
                      data-messages-url=@{/member/chats/{id}/messages(id=${chat.conversationId})},
                      data-send-url=@{/member/chats/{id}/send(id=${chat.conversationId})},
                      data-ws-url=@{/ws}">

        <!-- Thông tin PT -->
        <div class="uf-chat-main-header">

            <span class="uf-chat-avatar uf-chat-avatar-empty"
                  aria-hidden="true">
                ●
            </span>

            <div class="uf-chat-partner">

                <h2 th:text="${chat.partnerName}" data-uf-label>
                    Tên huấn luyện viên
                </h2>

                <p>
                    Huấn luyện viên ·
                    <span id="chatConnection">
                        Đang tải tin nhắn...
                    </span>
                </p>

            </div>

            <a th:href="@{/member/chats}"
               class="uf-chat-back">
                ← Danh sách
            </a>

        </div>

        <!-- Tin nhắn được lấy từ database qua API -->
        <div class="uf-chat-body"
             id="chatMessages"
             role="log"
             aria-live="polite"
             aria-label="Lịch sử tin nhắn">

            <p class="text-muted text-center">
                Đang tải lịch sử tin nhắn...
            </p>

        </div>

        <!-- Nhập và gửi tin -->
        <div class="uf-chat-composer">

            <div id="chatError"
                 class="uf-chat-error"
                 role="alert"
                 hidden>
            </div>

            <form id="chatForm"
                  class="uf-chat-form"
                  method="post"
                  autocomplete="off">

                <input type="hidden"
                       th:name="${_csrf.parameterName}"
                       th:value="${_csrf.token}">

                <label class="visually-hidden"
                       for="chatInput">
                    Nội dung tin nhắn
                </label>

                <input id="chatInput"
                       name="content"
                       type="text"
                       class="form-control"
                       maxlength="2000"
                       required
                       placeholder="Nhập tin nhắn cho PT...">

                <button id="chatSend"
                        class="uf-chat-send"
                        type="submit"
                        aria-label="Gửi tin nhắn">
                    ➤
                </button>

            </form>

            <p class="uf-chat-safety-note">
                Tin nhắn được lưu lại và tự cập nhật
                khi có tin mới.
            </p>

        </div>

    </section>

</main>

<div th:replace="~{fragments/scripts :: scripts}"></div>

<script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>

<!-- Giữ nguyên JavaScript gửi/nhận Member -->
<script th:src="@{/js/member-chat.js(v=3)}"></script>

<!-- Tìm kiếm và lọc sidebar -->
<script th:src="@{/js/utefit-chat-sidebar.js(v=1)}"></script>

</body>
</html>
