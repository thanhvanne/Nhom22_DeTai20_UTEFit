<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="${#authorization.expression('hasRole(''MEMBER'')')} ? ~{member/fragments/layout :: head('Kết quả VNPay - UTEFit')} : ~{fragments/head :: head('Kết quả VNPay - UTEFit')}"></head>
<body class="uf-theme uf-area-member uf-page-member-vnpay-result" th:classappend="${#authorization.expression('hasRole(''MEMBER'')')} ? 'uf-member' : ''">
<header th:replace="${#authorization.expression('hasRole(''MEMBER'')')} ? ~{member/fragments/layout :: header} : ~{fragments/header :: header}"></header>
<main class="container ut-page">
    <div class="ut-panel">
        <h1 class="ut-page-title">Kết quả VNPay Sandbox</h1>
        <p role="status" th:text="${message}" data-uf-label></p>
        <a class="btn btn-brand" th:href="@{/member/payments}">Lịch sử thanh toán</a>
        <a class="btn btn-outline-light" th:href="@{/member/memberships}">Gói tập của tôi</a>
    </div>
</main>
<footer th:replace="${#authorization.expression('hasRole(''MEMBER'')')} ? ~{member/fragments/layout :: footer} : ~{fragments/footer :: footer}"></footer>
<div th:replace="${#authorization.expression('hasRole(''MEMBER'')')} ? ~{member/fragments/layout :: scripts} : ~{fragments/scripts :: scripts}"></div>
</body>
</html>
