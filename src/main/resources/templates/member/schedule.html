
<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head('Lịch lớp của tôi - UTEFit')}">
</head>

<body>

<header th:replace="~{fragments/header :: header}">
</header>

<main class="container ut-page">

    <div class="d-flex justify-content-between
                align-items-center flex-wrap gap-3 mb-4">

        <div>

            <h1 class="ut-page-title">
                Lịch lớp <span>của tôi</span>
            </h1>

            <p class="ut-subtitle mb-0">
                Danh sách các lịch bạn đã đăng ký và hủy.
            </p>

        </div>

        <a class="btn btn-brand"
           th:href="@{/member/classes}">
            Tìm lịch lớp mới
        </a>

    </div>

    <div th:if="${success}"
         class="alert alert-success"
         th:text="${success}">
    </div>

    <div th:if="${error}"
         class="alert alert-danger"
         th:text="${error}">
    </div>

    <div class="ut-panel">

        <div class="table-responsive">

            <table class="table ut-table align-middle">

                <thead>
                <tr>
                    <th>Lớp tập</th>
                    <th>Chi nhánh</th>
                    <th>Ngày</th>
                    <th>Giờ</th>
                    <th>Phòng</th>
                    <th>Trạng thái</th>
                    <th>Thao tác</th>
                </tr>
                </thead>

                <tbody>

                <tr th:each="b : ${bookings}">

                    <td th:text="${b.className}">
                        Yoga
                    </td>

                    <td th:text="${b.branchName}">
                        UTEFit
                    </td>

                    <td th:text="${#temporals.format(b.date, 'dd/MM/yyyy')}">
                        01/11/2026
                    </td>

                    <td th:text="${b.startTime + ' - ' + b.endTime}">
                        08:00 - 09:00
                    </td>

                    <td th:text="${b.room ?: '-'}">
                        A1
                    </td>

                    <td>

                        <span class="ut-status"
                              th:classappend="${b.status == 'REGISTERED' ? 'ACTIVE' : 'CANCELLED'}"
                              th:text="${b.status == 'REGISTERED' ? 'Đã đăng ký' : (b.status == 'CANCELLED' ? 'Đã hủy' : b.status)}">
                            REGISTERED
                        </span>

                    </td>

                    <td>

                        <form th:if="${b.canCancel}"
                              method="post"
                              th:action="@{/member/classes/{id}/cancel(id=${b.scheduleId})}">

                            <input type="hidden"
                                   th:name="${_csrf.parameterName}"
                                   th:value="${_csrf.token}">

                            <button type="submit"
                                    class="btn btn-outline-danger btn-sm"
                                    onclick="return confirm('Bạn chắc chắn muốn hủy lịch lớp này?')">

                                Hủy lịch

                            </button>

                        </form>

                        <span th:unless="${b.canCancel}"
                              class="text-secondary">
                            —
                        </span>

                    </td>

                </tr>

                </tbody>

            </table>

        </div>

        <p th:if="${#lists.isEmpty(bookings)}"
           class="ut-subtitle text-center my-4">

            Bạn chưa đăng ký lịch lớp nào.

        </p>

    </div>

</main>

<footer th:replace="~{fragments/footer :: footer}">
</footer>

<div th:replace="~{fragments/scripts :: scripts}">
</div>

</body>
</html>
