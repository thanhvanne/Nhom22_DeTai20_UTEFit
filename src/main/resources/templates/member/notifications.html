<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Thông báo - UTEFit')}"></head>
<body>
<header th:replace="~{fragments/header :: header}"></header>
<main class="container ut-page" id="memberNotifications"
      th:attr="data-ws-url=@{/ws},data-recent-url=@{/member/notifications/recent},data-latest-id=${#lists.isEmpty(notifications) ? 0 : notifications[0].id}">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
        <div>
            <h1 class="ut-page-title">Thông báo <span>của tôi</span></h1>
            <p class="ut-subtitle mb-0">Chưa đọc: <strong th:text="${unreadCount}">0</strong> · Hiển thị 20 thông báo gần nhất</p>
        </div>
        <form th:action="@{/member/notifications/read-all}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <button class="btn btn-brand" type="submit">Đánh dấu tất cả đã đọc</button>
        </form>
    </div>
    <p class="alert alert-info" id="notificationLive" hidden>Vừa có thông báo mới. Trang đang cập nhật…</p>
    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>
    <div class="row g-3">
        <div th:each="n : ${notifications}" class="col-12">
            <div class="ut-panel">
                <div class="d-flex flex-wrap justify-content-between align-items-start gap-3">
                    <div>
                        <span class="badge bg-warning text-dark" th:if="${!n.read}">Chưa đọc</span>
                        <span class="badge bg-secondary" th:if="${n.read}">Đã đọc</span>
                        <h2 class="h5 mt-2" th:text="${n.title}"></h2>
                        <p th:text="${n.content}"></p>
                        <small class="ut-subtitle" th:text="${#temporals.format(n.createdAt, 'dd/MM/yyyy HH:mm')}"></small>
                    </div>
                    <form th:if="${!n.read}" th:action="@{/member/notifications/{id}/read(id=${n.id})}" method="post">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <button class="btn btn-outline-light" type="submit">Đã đọc</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
    <div class="ut-panel text-center" th:if="${#lists.isEmpty(notifications)}">Chưa có thông báo nào.</div>
</main>
<footer th:replace="~{fragments/footer :: footer}"></footer>
<div th:replace="~{fragments/scripts :: scripts}"></div>
<script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
<script th:src="@{/js/member-chat.js}"></script>
</body>
</html>
