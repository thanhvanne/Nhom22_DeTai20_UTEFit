
<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org">

<head th:replace="${#authorization.expression('hasRole(''MEMBER'')')} ? ~{member/fragments/layout :: head('Gói tập - UTEFit')} : ~{fragments/head :: head('Gói tập - UTEFit')}">
</head>

<body class="uf-theme uf-area-guest uf-page-guest-membership-plans" th:classappend="${#authorization.expression('hasRole(''MEMBER'')')} ? 'uf-member uf-member-discovery' : ''">

<header th:replace="${#authorization.expression('hasRole(''MEMBER'')')} ? ~{member/fragments/layout :: header} : ~{fragments/header :: header}">
</header>

<th:block th:if="${#authorization.expression('isAnonymous()')}">
    <th:block th:replace="~{fragments/public-directory :: assets}"></th:block>
    <main th:replace="~{fragments/public-directory :: plans}"></main>
</th:block>
<th:block th:unless="${#authorization.expression('isAnonymous()')}">
<main class="container ut-page">

    <h1 class="ut-page-title">
        Gói tập <span>UTEFit</span>
    </h1>

    <p class="ut-subtitle">
        Các gói tập đang mở bán trên hệ thống.
    </p>

    <form th:action="@{/membership-plans}"
          method="get"
          class="ut-search row g-3">

        <div class="col-md-9">
            <input type="search"
                   name="keyword"
                   class="form-control"
                   placeholder="Tìm tên hoặc mô tả gói tập..."
                   th:value="${keyword}">
        </div>

        <div class="col-md-3">
            <button class="btn btn-brand w-100"
                    type="submit">
                Tìm gói tập
            </button>
        </div>

    </form>

    <div class="row g-4">

        <div class="col-md-6 col-lg-4"
             th:each="p : ${planPage.content}">

            <article class="ut-card">

                <div class="ut-card-body">

                    <h3 class="mt-3"
                        th:text="${@membershipDisplay.name(p.name)}" data-uf-label>
                        Gói tập
                    </h3>

                    <p th:text="${p.description}">
                        Mô tả gói
                    </p>

                    <h2 class="fw-bold mt-4"
                        style="color:#ff326b" th:style="${#authorization.expression('hasRole(''MEMBER'')')} ? 'color:var(--member-action)' : 'color:#ff326b'"
                        th:text="${@membershipDisplay.money(p.price)}" data-uf-label>
                        0 VND
                    </h2>

                    <p>
                        Thời hạn:
                        <strong th:text="${p.durationDescription}">30 ngày</strong>
                    </p>

                    <a class="btn btn-brand w-100 mt-3"
                       th:href="@{/member/memberships(planId=${p.id})}">
                        Chọn gói này
                    </a>

                </div>
            </article>

        </div>

    </div>

    <div th:if="${planPage.empty}"
         class="ut-panel text-center mt-4">
        Không tìm thấy gói tập phù hợp.
    </div>

    <nav th:if="${planPage.totalPages > 1}"
         class="mt-5">

        <ul class="pagination ut-pagination justify-content-center flex-wrap">

            <li class="page-item"
                th:classappend="${planPage.first} ? 'disabled'">

                <a class="page-link"
                   th:href="@{/membership-plans(page=${planPage.number - 1},keyword=${keyword})}">
                    Trước
                </a>

            </li>

            <li class="page-item"
                th:each="i : ${#numbers.sequence(0,planPage.totalPages - 1)}"
                th:classappend="${i == planPage.number} ? 'active'">

                <a class="page-link"
                   th:href="@{/membership-plans(page=${i},keyword=${keyword})}"
                   th:text="${i + 1}">
                    1
                </a>

            </li>

            <li class="page-item"
                th:classappend="${planPage.last} ? 'disabled'">

                <a class="page-link"
                   th:href="@{/membership-plans(page=${planPage.number + 1},keyword=${keyword})}">
                    Sau
                </a>

            </li>

        </ul>
    </nav>

</main>
</th:block>

<footer th:replace="${#authorization.expression('hasRole(''MEMBER'')')} ? ~{member/fragments/layout :: footer} : ~{fragments/footer :: footer}">
</footer>

<div th:replace="${#authorization.expression('hasRole(''MEMBER'')')} ? ~{member/fragments/layout :: scripts} : ~{fragments/scripts :: scripts}">
</div>

<th:block th:unless="${#authorization.expression('isAnonymous()')}">
<div th:replace="${#authorization.expression('hasRole(''MEMBER'')')} ? _ : ~{fragments/public-motion :: motion}"></div>
</th:block>
</body>
</html>
