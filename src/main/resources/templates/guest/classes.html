
<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org">

<head th:replace="${#authorization.expression('hasRole(''MEMBER'')')} ? ~{member/fragments/layout :: head('Lớp tập - UTEFit')} : ~{fragments/head :: head('Lớp tập - UTEFit')}">
</head>

<body class="uf-theme uf-area-guest uf-page-guest-classes" th:classappend="${#authorization.expression('hasRole(''MEMBER'')')} ? 'uf-member uf-member-discovery' : ''">

<header th:replace="${#authorization.expression('hasRole(''MEMBER'')')} ? ~{member/fragments/layout :: header} : ~{fragments/header :: header}">
</header>

<th:block th:if="${#authorization.expression('isAnonymous()')}">
    <th:block th:replace="~{fragments/public-directory :: assets}"></th:block>
    <main th:replace="~{fragments/public-directory :: classes}"></main>
</th:block>
<th:block th:unless="${#authorization.expression('isAnonymous()')}">
<main class="container ut-page">

    <h1 class="ut-page-title">
        Khám phá <span>lớp tập</span>
    </h1>

    <p class="ut-subtitle">
        Xem các lớp tập đang mở hoặc đã đủ chỗ.
        Lịch buổi tập và đăng ký có trong khu vực hội viên, tùy điều kiện của từng buổi tập.
    </p>

    <form class="ut-search row g-3"
          th:action="@{/classes}"
          method="get">

        <div class="col-md-5">

            <input name="keyword"
                   type="search"
                   class="form-control"
                   placeholder="Tên lớp hoặc danh mục..."
                   th:value="${keyword}">

        </div>

        <div class="col-md-4">

            <select name="branchId"
                    class="form-select">

                <option value="">
                    Tất cả chi nhánh
                </option>

                <option th:each="b : ${branches}"
                        th:value="${b.id}"
                        th:text="${b.name}"
                        th:selected="${branchId != null and branchId == b.id}">
                    Chi nhánh
                </option>

            </select>

        </div>

        <div class="col-md-3">
            <button class="btn btn-brand w-100"
                    type="submit">
                Tìm lớp tập
            </button>
        </div>

    </form>

    <div class="row g-4">

        <div class="col-md-6 col-lg-4"
             th:each="c : ${classPage.content}">

            <article class="ut-card">

                <div class="ut-card-body">

                    <span class="eyebrow"
                          th:text="${c.categoryName}">
                        DANH MỤC
                    </span>

                    <h3 class="mt-3"
                        th:text="${c.name}" data-uf-label>
                        Tên lớp
                    </h3>

                    <p th:text="${c.description}">
                        Mô tả
                    </p>

                    <p>
                        Chi nhánh:
                        <strong th:text="${@membershipDisplay.name(c.branchName)}">
                            UTEFit
                        </strong>
                    </p>

                    <p>
                        PT:
                        <strong th:text="${c.trainerName}">
                            Đang cập nhật
                        </strong>
                    </p>

                    <p>
                        Sức chứa:
                        <strong th:text="${c.capacity}">
                            20
                        </strong>
                    </p>

                    <div th:replace="~{fragments/favorite :: button('CLASS',${c.id},'/classes')}"></div>
                    <span class="ut-status"
                          th:classappend="${c.status}"
                          th:text="${c.status}" data-uf-label>
                        OPEN
                    </span>

                </div>

            </article>

        </div>
    </div>

    <div th:if="${classPage.empty}"
         class="ut-panel text-center mt-4">
        Không có lớp tập phù hợp.
    </div>

    <nav th:if="${classPage.totalPages > 1}"
         class="mt-5">

        <ul class="pagination ut-pagination justify-content-center flex-wrap">

            <li class="page-item"
                th:classappend="${classPage.first} ? 'disabled'">

                <a class="page-link"
                   th:href="@{/classes(page=${classPage.number - 1},keyword=${keyword},branchId=${branchId})}">
                    Trước
                </a>
            </li>

            <li class="page-item"
                th:each="i : ${#numbers.sequence(0,classPage.totalPages - 1)}"
                th:classappend="${i == classPage.number} ? 'active'">

                <a class="page-link"
                   th:href="@{/classes(page=${i},keyword=${keyword},branchId=${branchId})}"
                   th:text="${i + 1}">
                    1
                </a>
            </li>

            <li class="page-item"
                th:classappend="${classPage.last} ? 'disabled'">

                <a class="page-link"
                   th:href="@{/classes(page=${classPage.number + 1},keyword=${keyword},branchId=${branchId})}">
                    Sau
                </a>

            </li>

        </ul>
    </nav>

</main>
</th:block>

<footer th:replace="${#authorization.expression('hasRole(''MEMBER'')')} ? ~{member/fragments/layout :: footer} : ~{fragments/footer :: footer}">
</footer>

<div th:replace="${#authorization.expression('hasRole(''MEMBER'')')} ? ~{member/fragments/layout :: scripts} : ~{fragments/scripts :: scripts}">
</div>

<th:block th:unless="${#authorization.expression('isAnonymous()')}">
<div th:replace="${#authorization.expression('hasRole(''MEMBER'')')} ? _ : ~{fragments/public-motion :: motion}"></div>
</th:block>
</body>
</html>
