<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:replace="~{fragments/head :: head('UTEFit - Fitness Center')}">
</head>

<body class="uf-theme uf-area-guest uf-page-guest-home">

<link rel="stylesheet" th:href="@{/css/utefit-public-cinematic.css(v=2)}">
<link rel="stylesheet" th:href="@{/css/utefit-public-journey.css(v=1)}">
<link rel="stylesheet" th:href="@{/css/utefit-public-finale.css(v=1)}">
<th:block th:replace="~{fragments/branch-media :: assets}"></th:block>
<th:block sec:authorize="isAnonymous()">
    <header th:replace="~{fragments/public-cinematic :: navigation}"></header>
</th:block>
<th:block sec:authorize="isAuthenticated()">
    <header th:replace="~{fragments/header :: header}"></header>
</th:block>

<main>
    <section th:replace="~{fragments/public-cinematic :: experience}"></section>

    <th:block th:replace="~{fragments/public-journey :: journey}"></th:block>

    <section th:replace="~{fragments/public-finale :: finale}"></section>

</main>

<footer th:replace="~{fragments/footer :: footer}">
</footer>

<div th:replace="~{fragments/scripts :: scripts}">
</div>
<script defer th:src="@{/vendor/gsap/gsap-3.13.0.min.js}"></script>
<script defer th:src="@{/vendor/gsap/ScrollTrigger-3.13.0.min.js}"></script>
<script defer th:src="@{/js/utefit-public-surface.js(v=2)}"></script>
<script defer th:src="@{/js/utefit-public-cinematic.js(v=2)}"></script>

<script defer th:src="@{/js/utefit-public-journey.js(v=1)}"></script>
<script defer th:src="@{/js/utefit-public-finale.js(v=1)}"></script>

</body>
</html>
