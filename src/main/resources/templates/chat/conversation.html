<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head th:replace="${#authorization.expression('hasRole(''MEMBER'')')} ? ~{member/fragments/layout :: head('Trò chuyện với PT - UTEFit')} : _">
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Chat PT 1:1 - UTEFIT</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          th:href="@{/css/style.css}">

    <link rel="stylesheet"
          th:href="@{/css/stage3.css}">

    <link rel="stylesheet"
          th:href="@{/css/member-dashboard.css}">

    <link rel="stylesheet"
          th:href="@{/css/utefit-chat.css(v=2)}">
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/utefit-premium.css(v=2)}">
    <link rel="stylesheet" th:href="@{/css/utefit-interface.css(v=1)}">
    <script defer th:src="@{/js/utefit-interface.js(v=1)}"></script>
    <link rel="stylesheet" th:href="@{/css/utefit-studio.css}">
    <link rel="stylesheet" th:href="@{/css/utefit-layouts.css(v=1)}">
    <script defer th:src="@{/js/utefit-accessibility.js(v=1)}"></script>
</head>

<body class="uf-chat-page uf-theme uf-area-chat uf-page-chat-conversation" th:classappend="${#authorization.expression('hasRole(''MEMBER'')')} ? 'uf-member' : ''">

<header th:replace="${#authorization.expression('hasRole(''MEMBER'')')} ? ~{member/fragments/layout :: header} : ~{fragments/header :: header}"></header>

<!-- Dùng chung cho PT và Member legacy -->
<main class="uf-chat-workspace has-active-chat"

      th:with="memberSide=${partnerIsTrainer},
               activeConversationId=${conversationId},
               acceptedTrainers=${null}">

    <!-- Danh sách chat bên trái -->
    <aside th:replace="${#authorization.expression('hasRole(''MEMBER'')')} ? ~{member/fragments/chat-sidebar :: sidebar} : ~{fragments/chat-sidebar :: sidebar}"></aside>

    <!-- Khung hội thoại -->
    <section class="uf-chat-main"
             id="ptChat"
             aria-label="Cuộc trò chuyện"

             th:attr="data-conversation-id=${conversationId},
                      data-ws-url=@{/ws},
                      data-messages-url=${partnerIsTrainer} ? @{/member/chats/{id}/messages(id=${conversationId})} : @{/pt/chats/{id}/messages(id=${conversationId})},
                      data-send-url=${partnerIsTrainer} ? @{/member/chats/{id}/send(id=${conversationId})} : @{/pt/chats/{id}/send(id=${conversationId})}">

        <!-- Header cuộc trò chuyện -->
        <div class="uf-chat-main-header">

            <img class="uf-chat-avatar"

                 th:if="${partnerAvatarUrl != null and !#strings.isEmpty(partnerAvatarUrl)}"

                 th:src="${partnerAvatarUrl}"
                 th:alt="|Ảnh ${partnerName}|">

            <span class="uf-chat-avatar uf-chat-avatar-empty"

                  th:unless="${partnerAvatarUrl != null and !#strings.isEmpty(partnerAvatarUrl)}"

                  aria-hidden="true">
                ●
            </span>

            <div class="uf-chat-partner">

                <h2 th:replace="${#authorization.expression('hasRole(''MEMBER'')')} ? ~{member/fragments/layout :: conversationTitle(${partnerName})} : _" th:text="${partnerName}" data-uf-label>
                    Tên người trò chuyện
                </h2>

                <p>

                    <span th:text="${partnerIsTrainer} ? 'Huấn luyện viên' : 'Hội viên'">
                        Hội viên
                    </span>

                    ·

                    <span id="chatConnection">
                        Đang tải tin nhắn...
                    </span>

                </p>

            </div>

            <a id="ptChatBackBtn"
               class="uf-chat-back"

               th:href="${partnerIsTrainer} ? @{/member/chats} : @{/pt/chats}">

                ← Danh sách

            </a>

        </div>

        <!-- Lịch sử tin nhắn -->
        <div id="chatMessages"
             class="uf-chat-body"
             role="log"
             aria-live="polite"
             aria-label="Lịch sử tin nhắn">

            <div th:each="msg : ${messages}"

                 th:class="${msg.mine} ? 'd-flex justify-content-end' : 'd-flex justify-content-start'">

                <div th:class="${msg.mine} ? 'p-2 rounded-3 bg-primary text-white' : 'p-2 rounded-3 bg-light text-dark'">

                    <div th:text="${msg.content}">
                        Nội dung tin nhắn
                    </div>

                    <small class="d-block opacity-75 mt-1 text-end"

                           th:text="${msg.sentAt != null ? #temporals.format(msg.sentAt, 'dd/MM HH:mm') : ''}">

                        21:50

                    </small>

                </div>

            </div>

        </div>

        <!-- Composer -->
        <div class="uf-chat-composer">

            <div id="chatError"
                 class="uf-chat-error"
                 role="alert"
                 hidden>
            </div>

            <form id="ptChatForm"
                  class="uf-chat-form"
                  method="post"
                  autocomplete="off">

                <input type="hidden"
                       th:name="${_csrf.parameterName}"
                       th:value="${_csrf.token}">

                <label class="visually-hidden"
                       for="ptChatInput">
                    Nội dung tin nhắn
                </label>

                <input name="content"
                       id="ptChatInput"
                       type="text"
                       class="form-control"
                       maxlength="2000"
                       required
                       placeholder="Nhập tin nhắn...">

                <button id="ptChatSend"
                        type="submit"
                        class="uf-chat-send"
                        aria-label="Gửi tin nhắn">

                    ➤

                </button>

            </form>

            <p class="uf-chat-safety-note">
                Tin nhắn được lưu lại và tự cập nhật
                khi có tin mới.
            </p>

        </div>

    </section>

</main>

<div th:replace="${#authorization.expression('hasRole(''MEMBER'')')} ? ~{member/fragments/layout :: scripts} : ~{fragments/scripts :: scripts}"></div>

<script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>

<!-- Giữ nguyên JavaScript PT gửi HTTP POST + WebSocket -->
<script th:src="@{/js/chat/conversation.js(v=3)}"></script>

<!-- Sidebar -->
<script th:src="@{/js/utefit-chat-sidebar.js(v=1)}"></script>

</body>
</html>
