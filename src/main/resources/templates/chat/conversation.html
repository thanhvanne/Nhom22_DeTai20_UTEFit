<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Chat PT 1:1 - UTEFit')}"></head>
<body>
<header th:replace="~{fragments/header :: header}"></header>

<main class="container py-5">
    <div id="ptChat" class="mx-auto"
         style="max-width: 820px"
         th:attr="data-conversation-id=${conversationId},
                  data-ws-url=@{/ws},
                  data-back-url=@{/pt/chats}">
        <h1 class="h4 mb-3">Trò chuyện với <span th:text="${partnerName}">Hội viên</span></h1>

        <div class="card border-0 shadow">
            <!-- Header thẻ chat + nút Thoát -->
            <div class="card-header bg-dark text-white py-3 d-flex align-items-center justify-content-between">
                <div>
                    <strong th:text="${partnerName}">Hội viên</strong>
                    <span id="chatConnection" class="small ms-2">Đang kết nối…</span>
                </div>
                <a id="ptChatBackBtn" th:href="@{/pt/chats}" class="btn btn-sm btn-outline-light">
                    ← Danh sách chat
                </a>
            </div>

            <!-- Lịch sử tin nhắn -->
            <div id="chatMessages"
                 class="card-body d-flex flex-column gap-2"
                 role="log" aria-live="polite"
                 style="height: 440px; overflow-y: auto; background: #f8fafc; color: #111827">
                <div th:each="msg : ${messages}">
                    <div th:class="${msg.mine} ? 'd-flex justify-content-end' : 'd-flex justify-content-start'">
                        <div th:class="${msg.mine} ? 'p-2 rounded-3 bg-primary text-white'
                                                  : 'p-2 rounded-3 bg-light text-dark'"
                             style="max-width: 70%;">
                            <div th:text="${msg.content}">Nội dung</div>
                            <!-- Để JS format giờ, tránh lỗi Thymeleaf -->
                            <div class="small opacity-75 mt-1 text-end"
                                 th:attr="data-sent-at=${msg.sentAt}"
                                 th:text="${msg.sentAt}">
                                2026-10-21T23:11:00
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Footer: ô nhập + gửi -->
            <div class="card-footer bg-white">
                <div id="chatError" role="alert" class="text-danger small mb-2" hidden></div>

                <!-- Chặn submit tuyệt đối để không reload -->
                <form id="ptChatForm" class="d-flex gap-2" action="javascript:void(0)" onsubmit="return false;" autocomplete="off">
                    <input name="content" id="ptChatInput" class="form-control"
                           maxlength="2000" placeholder="Nhập tin nhắn cho hội viên…" required>
                    <button id="ptChatSend" type="submit" class="btn btn-primary">Gửi</button>
                </form>

                <p class="small text-muted mt-2 mb-0">
                    Tin nhắn được lưu trong database; khi mất kết nối realtime, hệ thống sẽ tự kết nối lại và cập nhật.
                </p>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>
<div th:replace="~{fragments/scripts :: scripts}"></div>

<!-- SockJS + STOMP -->
<script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>

<!-- JS PT chat -->
<script th:src="@{/js/pt-chat.js(v=2)}"></script>
</body>
</html>
