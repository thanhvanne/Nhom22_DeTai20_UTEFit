<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:replace="~{fragments/head :: head('Nhắn tin - UTEFit')}"></head>

<body th:attr="data-conversation-id=${conversationId},data-ws-endpoint=@{/ws}">

<!-- CSS riêng cho trang chat, KHÔNG đụng header -->
<style>
    body {
        background: #f1f5f9;
        color: #0f172a;
    }

    .chat-wrapper {
        max-width: 760px;
        margin: 2rem auto;
    }

    .chat-frame {
        background: #ffffff;
        border-radius: 1.5rem;
        border: 1px solid #e2e8f0;
        box-shadow: 0 24px 60px rgba(15, 23, 42, 0.12);
        overflow: hidden;
    }

    .chat-header-bar {
        background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 100%);
        color: #fff;
        padding: 1.25rem 1.5rem;
        display: flex;
        align-items: center;
        gap: 1rem;
    }

    .avatar-circle {
        width: 52px;
        height: 52px;
        border-radius: 50%;
        background: linear-gradient(135deg, #60a5fa, #2563eb);
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
        font-size: 1.1rem;
        box-shadow: 0 4px 12px rgba(37, 99, 235, 0.35);
        overflow: hidden;
        flex-shrink: 0;
    }

    .avatar-circle img {
        width: 100%;
        height: 100%;
        object-fit: cover;
    }

    .chat-header-bar h5 {
        margin-bottom: 0.1rem;
        font-weight: 600;
    }

    .chat-header-bar small {
        font-size: 0.8rem;
        opacity: 0.85;
    }

    .chat-messages {
        height: 460px;
        overflow-y: auto;
        padding: 1.25rem 1.25rem 0.75rem 1.25rem;
        background: #f8fafc;
        display: flex;
        flex-direction: column;
        gap: 0.65rem;
    }

    .bubble-row {
        display: flex;
        align-items: flex-end;
        gap: 0.5rem;
    }

    .bubble-row.me {
        justify-content: flex-end;
    }

    .bubble-row.other {
        justify-content: flex-start;
    }

    .bubble {
        max-width: 75%;
        padding: 0.6rem 1rem;
        border-radius: 1.1rem;
        font-size: 0.92rem;
        line-height: 1.35;
        word-break: break-word;
        box-shadow: 0 1px 2px rgba(15, 23, 42, 0.08);
        animation: fadeUp 0.18s ease-out both;
    }

    @keyframes fadeUp {
        from {
            opacity: 0;
            transform: translateY(6px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    .bubble.me {
        background: linear-gradient(135deg, #3b82f6, #2563eb);
        color: #ffffff;
        border-bottom-right-radius: 0.3rem;
    }

    .bubble.other {
        background: #ffffff;
        color: #0f172a;
        border: 1px solid #e2e8f0;
        border-bottom-left-radius: 0.3rem;
    }

    .bubble-time {
        margin-top: 0.3rem;
        font-size: 0.7rem;
        opacity: 0.7;
        text-align: right;
    }

    .bubble.other .bubble-time {
        text-align: left;
    }

    .msg-avatar {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        background: linear-gradient(135deg, #93c5fd, #2563eb);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 0.7rem;
        font-weight: 600;
        color: #fff;
        flex-shrink: 0;
    }

    .msg-avatar img {
        width: 100%;
        height: 100%;
        object-fit: cover;
    }

    .chat-footer {
        padding: 0.75rem 1rem;
        background: #ffffff;
        border-top: 1px solid #e2e8f0;
    }

    .chat-input {
        border-radius: 999px;
        border: 1.5px solid #e2e8f0;
        padding: 0.6rem 1rem;
        font-size: 0.92rem;
    }

    .chat-input:focus {
        border-color: #3b82f6;
        box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
        outline: none;
    }

    .btn-send {
        width: 44px;
        height: 44px;
        border-radius: 50%;
        border: none;
        background: linear-gradient(135deg, #3b82f6, #2563eb);
        color: #fff;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        margin-left: 0.5rem;
    }

    .btn-send:hover {
        box-shadow: 0 8px 18px rgba(37, 99, 235, 0.35);
        transform: translateY(-1px);
    }
</style>

<header th:replace="~{fragments/header :: header}"></header>

<main class="py-4">
    <div class="container">
        <div class="chat-wrapper">
            <div class="chat-frame">

                <!-- Thanh tiêu đề chat -->
                <div class="chat-header-bar">
                    <div class="avatar-circle">
                        <img th:if="${partnerAvatarUrl != null}"
                             th:src="${partnerAvatarUrl}" alt="avatar">
                        <span th:if="${partnerAvatarUrl == null}"
                              th:text="${#strings.substring(partnerName, 0, 1)}">A</span>
                    </div>
                    <div>
                        <h5 th:text="${partnerName}">Tên đối tác</h5>
                        <small th:text="${partnerIsTrainer} ? 'Huấn luyện viên UTEFit' : 'Hội viên UTEFit'">
                            Vai trò
                        </small>
                    </div>
                </div>

                <!-- Lịch sử tin nhắn -->
                <div id="chatMessages" class="chat-messages">
                    <div th:each="msg : ${messages}">
                        <div th:class="${msg.mine} ? 'bubble-row me' : 'bubble-row other'">
                            <div th:if="${!msg.mine}" class="msg-avatar">
                                <img th:if="${partnerAvatarUrl != null}"
                                     th:src="${partnerAvatarUrl}" alt="">
                                <span th:if="${partnerAvatarUrl == null}"
                                      th:text="${#strings.substring(partnerName, 0, 1)}">A</span>
                            </div>
                            <div th:class="${msg.mine} ? 'bubble me' : 'bubble other'">
                                <div th:text="${msg.content}">Nội dung</div>
                                <div class="bubble-time"
                                     th:text="${#dates.format(msg.sentAt, 'HH:mm')}">10:30</div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Ô nhập tin nhắn -->
                <div class="chat-footer">
                    <form onsubmit="sendMessage(); return false;" class="d-flex align-items-center">
                        <input id="messageInput" type="text"
                               class="form-control chat-input"
                               placeholder="Nhập tin nhắn..." autocomplete="off">
                        <button type="submit" class="btn-send" aria-label="Gửi">
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18"
                                 fill="none" stroke="currentColor" stroke-width="2.2"
                                 stroke-linecap="round" stroke-linejoin="round"
                                 viewBox="0 0 24 24">
                                <line x1="22" y1="2" x2="11" y2="13"></line>
                                <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                            </svg>
                        </button>
                    </form>
                </div>

            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>
<div th:replace="~{fragments/scripts :: scripts}"></div>

<script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>

<script>
    let stompClient = null;
    let conversationId = null;
    let wsEndpoint = null;

    function connectWebSocket() {
        wsEndpoint = document.body.dataset.wsEndpoint || '/ws';
        const socket = new SockJS(wsEndpoint);
        stompClient = Stomp.over(socket);
        stompClient.debug = null;

        stompClient.connect({}, function () {
            stompClient.subscribe('/user/queue/chat', function (message) {
                const payload = JSON.parse(message.body);
                if (payload.conversationId === conversationId) {
                    appendMessage(payload);
                }
            });
        }, function () {
            console.warn('Mất kết nối WebSocket');
        });
    }

    function appendMessage(msg) {
        const container = document.getElementById('chatMessages');
        const row = document.createElement('div');
        row.className = msg.mine ? 'bubble-row me' : 'bubble-row other';

        let html = '';
        if (!msg.mine) {
            const firstChar = (msg.senderName && msg.senderName.length > 0)
                ? msg.senderName.substring(0, 1)
                : 'A';
            html += `<div class="msg-avatar"><span>${firstChar}</span></div>`;
        }

        const sentDate = msg.sentAt ? new Date(msg.sentAt) : new Date();
        const timeStr = sentDate.toLocaleTimeString('vi-VN', {hour: '2-digit', minute: '2-digit'});

        html += `<div class="bubble ${msg.mine ? 'me' : 'other'}">
                    <div>${msg.content}</div>
                    <div class="bubble-time">${timeStr}</div>
                 </div>`;

        row.innerHTML = html;
        container.appendChild(row);
        container.scrollTop = container.scrollHeight;
    }

    function sendMessage() {
        if (!stompClient || !stompClient.connected) {
            alert('Kết nối chat chưa sẵn sàng.');
            return;
        }
        const input = document.getElementById('messageInput');
        const content = input.value.trim();
        if (!content) return;

        stompClient.send('/app/chat.send', {}, JSON.stringify({
            conversationId: conversationId,
            content: content
        }));
        input.value = '';
    }

    document.addEventListener('DOMContentLoaded', function () {
        const body = document.body;
        conversationId = parseInt(body.dataset.conversationId, 10) || null;

        connectWebSocket();

        document.getElementById('messageInput').addEventListener('keydown', function (e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        const container = document.getElementById('chatMessages');
        container.scrollTop = container.scrollHeight;
    });
</script>

</body>
</html>
